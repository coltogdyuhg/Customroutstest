<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CustomRoutes - Navigator Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet.js -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        darkCard: '#1e293b'
                    }
                }
            }
        }
    </script>

    <style>
        :root { --header-h: 64px; }
        #map { height: calc(100vh - var(--header-h)); width: 100%; background: #0f172a; z-index: 1; }
        
        /* Mobile Sidebar Styles */
        .mode-mobile #sidebar {
            position: fixed; bottom: 0; left: 0; width: 100% !important;
            height: auto !important; 
            z-index: 50;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 2rem 2rem 0 0;
        }

        .mode-mobile #sidebar.is-collapsed {
            transform: translateY(calc(100% - 70px));
        }

        .mode-desktop #sidebar { width: 22rem; height: 100%; }

        .gradient-header { background: linear-gradient(90deg, #4f46e5 0%, #7c3aed 50%, #db2777 100%); }
        .hero-pattern {
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }

        .user-location-marker {
            background: #4f46e5; 
            border: 3px solid white; 
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }
        .pulse-ring {
            position: absolute;
            top: 50%; left: 50%;
            width: 14px; height: 14px;
            margin-top: -7px; margin-left: -7px;
            border-radius: 50%;
            background: rgba(79, 70, 229, 0.4);
            animation: pulse-animation 2s infinite;
        }
        @keyframes pulse-animation {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(4); opacity: 0; }
        }

        .search-pin-drop {
            animation: pin-drop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes pin-drop {
            0% { transform: translateY(-40px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        .leaflet-container { background: transparent !important; }
        .dark .map-tile-light { filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3); }
        .dark .leaflet-container { background: #0f172a !important; }

        #mobile-drag-handle { display: none; }
        .mode-mobile #mobile-drag-handle { display: flex; }

        .leaflet-control-layers { border-radius: 12px !important; border: none !important; box-shadow: 0 4px 15px rgba(0,0,0,0.1) !important; padding: 5px !important; }
        
        /* Toggle Switch Style */
        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 20px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #cbd5e1;
            transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 14px; width: 14px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: #4f46e5; }
        input:checked + .slider:before { transform: translateX(20px); }

        /* Construction Layer Styles */
        .construction-polyline {
            color: #f97316 !important;
            weight: 8 !important;
            opacity: 0.9 !important;
        }
        .construction-marker {
            background: #f97316;
            border: 3px solid white;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            box-shadow: 0 0 15px rgba(249, 115, 22, 0.6);
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 overflow-hidden font-sans text-slate-900 transition-colors duration-300">

    <!-- Drive Mode HUD Overlay -->
    <div id="drive-hud" class="fixed top-20 right-4 z-[2000] hidden transition-all duration-500 scale-90 origin-top-right">
        <div class="bg-slate-900/90 text-white rounded-3xl p-4 shadow-2xl flex items-center gap-6 border border-white/10 backdrop-blur-md">
            <div class="flex flex-col border-r border-white/10 pr-4">
                <span class="text-[8px] font-black uppercase tracking-widest text-indigo-400">Distance</span>
                <span id="hud-miles" class="text-lg font-black italic tabular-nums">0.00 Mi</span>
            </div>
            <div class="flex gap-4">
                <div class="flex flex-col items-center">
                    <span class="text-[8px] font-black uppercase tracking-widest text-indigo-400">Drive</span>
                    <span id="hud-time-car" class="text-sm font-black italic tabular-nums">--m</span>
                </div>
                <div class="flex flex-col items-center">
                    <span class="text-[8px] font-black uppercase tracking-widest text-emerald-400">Bike</span>
                    <span id="hud-time-bike" class="text-sm font-black italic tabular-nums">--m</span>
                </div>
                <div class="flex flex-col items-center">
                    <span class="text-[8px] font-black uppercase tracking-widest text-pink-400">Walk</span>
                    <span id="hud-time-walk" class="text-sm font-black italic tabular-nums">--m</span>
                </div>
            </div>
            <button onclick="exitDriveMode()" class="bg-rose-500/20 text-rose-500 p-2 rounded-xl hover:bg-rose-500 hover:text-white transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
    </div>

    <!-- Construction Details Modal -->
    <div id="construction-modal" class="fixed inset-0 z-[1000] hidden flex items-center justify-center p-6 bg-slate-950/60 backdrop-blur-sm">
        <div class="bg-white dark:bg-slate-800 w-full max-w-md rounded-[2.5rem] p-6 shadow-2xl space-y-4 border border-slate-200 dark:border-slate-700">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-orange-500 rounded-2xl flex items-center justify-center">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.114 5.636a1 1 0 010 1.728l-4.586 4.586a1 1 0 01-1.414 0l-4.586-4.586a1 1 0 011.728-1.728L13 8.414l4.586-4.586a1 1 0 011.728 0zM9 15l2.879-2.879a1 1 0 011.414 0L17 15M5 3h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2z"></path>
                    </svg>
                </div>
                <div>
                    <h3 class="text-lg font-black dark:text-white">Road Closure</h3>
                    <p id="construction-location" class="text-[10px] text-orange-600 font-bold uppercase tracking-widest">Loading...</p>
                </div>
            </div>
            <div class="space-y-3 p-4 bg-orange-50 dark:bg-orange-900/20 border border-orange-100 dark:border-orange-800 rounded-2xl">
                <div class="flex justify-between">
                    <span class="text-[10px] font-black text-orange-600 uppercase tracking-widest">Start Date</span>
                    <span id="construction-start" class="text-[10px] font-black dark:text-white">Loading...</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-[10px] font-black text-orange-600 uppercase tracking-widest">End Date</span>
                    <span id="construction-end" class="text-[10px] font-black dark:text-white">Loading...</span>
                </div>
                <div class="flex justify-between pt-2 border-t border-orange-200 dark:border-orange-700">
                    <span class="text-[10px] font-black text-orange-600 uppercase tracking-widest">Reason</span>
                    <span id="construction-reason" class="text-[10px] font-bold dark:text-white">Loading...</span>
                </div>
            </div>
            <button id="close-construction-modal" class="w-full bg-orange-500 text-white py-3 rounded-2xl font-black uppercase text-[10px] tracking-widest shadow-lg shadow-orange-500/20 hover:bg-orange-600 transition-all">Close</button>
        </div>
    </div>

    <!-- Route Name Modal -->
    <div id="name-modal" class="fixed inset-0 z-[1000] hidden flex items-center justify-center p-6 bg-slate-950/60 backdrop-blur-sm">
        <div class="bg-white dark:bg-slate-800 w-full max-w-sm rounded-[2.5rem] p-8 shadow-2xl space-y-6 border border-slate-200 dark:border-slate-700">
            <div class="space-y-2">
                <h3 class="text-xl font-black italic uppercase tracking-tighter dark:text-white">Name Your Route</h3>
                <p id="modal-dist" class="text-[10px] text-indigo-500 font-bold uppercase tracking-widest">Total Distance: 0.00 miles</p>
            </div>
            <input id="route-name-input" type="text" placeholder="e.g. Morning Run" class="w-full p-4 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl text-xs font-bold outline-none focus:ring-2 ring-indigo-500 dark:text-white">
            <div class="flex gap-3">
                <button id="confirm-save-btn" class="flex-grow bg-indigo-600 text-white py-4 rounded-2xl font-black uppercase text-[10px] tracking-widest shadow-lg shadow-indigo-500/20">Save Path</button>
                <button id="close-modal-btn" class="px-6 bg-slate-100 dark:bg-slate-700 text-slate-400 dark:text-slate-300 py-4 rounded-2xl font-black uppercase text-[10px]">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Settings Sidebar -->
    <div id="settings-panel" class="fixed inset-y-0 right-0 w-full md:w-80 bg-white dark:bg-slate-900 z-[1100] translate-x-full transition-transform duration-300 ease-in-out shadow-2xl border-l border-slate-200 dark:border-slate-800">
        <div class="h-16 flex items-center justify-between px-6 border-b border-slate-100 dark:border-slate-800">
            <h3 class="text-xs font-black uppercase tracking-widest dark:text-white">System Settings</h3>
            <button onclick="toggleSettings()" class="text-slate-400 hover:text-rose-500 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <div class="p-6 space-y-8">
            <div class="space-y-4">
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Appearance</label>
                <div class="grid grid-cols-2 gap-2 p-1 bg-slate-100 dark:bg-slate-800 rounded-2xl">
                    <button onclick="setTheme('light')" id="theme-light-btn" class="py-3 rounded-xl text-[10px] font-black uppercase transition-all">Light</button>
                    <button onclick="setTheme('dark')" id="theme-dark-btn" class="py-3 rounded-xl text-[10px] font-black uppercase transition-all">Dark</button>
                </div>
            </div>
            
            <div class="space-y-4">
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Global Options</label>
                <div class="flex items-center justify-between p-4 bg-slate-50 dark:bg-slate-800 rounded-2xl">
                    <span class="text-[10px] font-black uppercase dark:text-white">Start at Location</span>
                    <label class="switch">
                        <input type="checkbox" id="settings-start-at-loc" onchange="syncToggles(this)">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <div class="pt-10 border-t border-slate-100 dark:border-slate-800 text-center">
                <p class="text-[9px] text-slate-400 font-bold uppercase">CustomRoutes v2.5.0</p>
            </div>
        </div>
    </div>

    <!-- Loading Screen -->
    <div id="boot-screen" class="fixed inset-0 z-[300] flex flex-col items-center justify-center p-6 text-center transition-all duration-700">
        <div class="absolute inset-0 hero-pattern bg-slate-950"></div>
        <div class="relative max-w-md w-full space-y-8">
            <div class="space-y-3">
                <div class="w-16 h-16 bg-indigo-600 rounded-2xl mx-auto flex items-center justify-center shadow-2xl shadow-indigo-500/20 animate-bounce">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                </div>
                <h2 class="text-3xl font-black text-white italic uppercase tracking-tighter">CustomRoutes</h2>
                <p class="text-indigo-400 text-[10px] font-black uppercase tracking-[0.4em]" id="boot-label">System Initializing...</p>
            </div>
            <div class="relative w-full bg-white/5 h-1.5 rounded-full overflow-hidden border border-white/5">
                <div id="boot-progress" class="h-full bg-indigo-500 w-0 transition-all duration-200 ease-out"></div>
            </div>
        </div>
    </div>

    <!-- Interface Selection -->
    <div id="selection-screen" class="fixed inset-0 z-[200] hidden flex flex-col items-center justify-center p-6 transition-all duration-
