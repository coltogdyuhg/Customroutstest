<script>
    let map, polyline, markers = [], routePath = [];
    let isDrawing = false, userMarker = null, searchMarker = null;
    let savedRoutes = JSON.parse(localStorage.getItem('saved_routes')) || [];
    let lastKnownPos = null;
    let activeViewLine = null;
    let isDriving = false;
    let currentDriveRoute = null;
    let currentTheme = localStorage.getItem('theme') || 'light';
    let currentMode = 'desktop';
    let initialRecenterDone = false;
    let startAtLocation = false;

    // === NEW: Direction / Compass variables ===
    let currentHeading = 0;           // degrees (0 = North)
    let compassControl = null;
    let headingMarker = null;

    function syncToggles(el) {
        startAtLocation = el.checked;
        document.getElementById('settings-start-at-loc').checked = startAtLocation;
        document.getElementById('inline-start-at-loc').checked = startAtLocation;
    }

    function toggleSidebarCollapse() {
        const sidebar = document.getElementById('sidebar');
        const chevron = document.getElementById('sidebar-chevron');
        sidebar.classList.toggle('is-collapsed');
        chevron.style.transform = sidebar.classList.contains('is-collapsed') ? 'rotate(180deg)' : 'rotate(0deg)';
    }

    const searchPinIcon = L.divIcon({
        className: 'search-pin-wrapper',
        html: `
            <div class="search-pin-drop">
                <svg class="w-8 h-8 text-rose-600 drop-shadow-lg" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"></path>
                </svg>
            </div>
        `,
        iconSize: [32, 32],
        iconAnchor: [16, 32]
    });

    // === NEW: Compass Control ===
    function createCompassControl() {
        const CompassControl = L.Control.extend({
            onAdd: function(map) {
                const div = L.DomUtil.create('div', 'compass-container');
                div.style.cssText = `
                    background: rgba(15, 23, 42, 0.85);
                    backdrop-filter: blur(12px);
                    border: 1px solid rgba(255,255,255,0.15);
                    border-radius: 9999px;
                    width: 62px;
                    height: 62px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.3);
                    position: relative;
                    z-index: 1000;
                `;

                div.innerHTML = `
                    <div style="position: relative; width: 52px; height: 52px;">
                        <!-- Compass ring -->
                        <svg width="52" height="52" viewBox="0 0 52 52" style="transform: rotate(-90deg);">
                            <circle cx="26" cy="26" r="24" fill="none" stroke="#334155" stroke-width="3"/>
                            <text x="26" y="14" text-anchor="middle" fill="#94a3b8" font-size="9" font-weight="700">N</text>
                            <text x="45" y="29" text-anchor="middle" fill="#94a3b8" font-size="8" font-weight="500">E</text>
                            <text x="26" y="45" text-anchor="middle" fill="#94a3b8" font-size="9" font-weight="700">S</text>
                            <text x="7" y="29" text-anchor="middle" fill="#94a3b8" font-size="8" font-weight="500">W</text>
                        </svg>
                        
                        <!-- Heading Arrow -->
                        <div id="compass-arrow" style="
                            position: absolute;
                            top: 50%;
                            left: 50%;
                            width: 0;
                            height: 0;
                            border-left: 6px solid transparent;
                            border-right: 6px solid transparent;
                            border-bottom: 22px solid #22d3ee;
                            transform-origin: 50% 100%;
                            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
                            transition: transform 0.15s ease-out;
                        "></div>
                    </div>
                `;

                // Prevent map clicks when touching compass
                L.DomEvent.disableClickPropagation(div);
                return div;
            }
        });

        compassControl = new CompassControl({ position: 'bottomleft' });
        map.addControl(compassControl);
    }

    function updateCompass() {
        const arrow = document.getElementById('compass-arrow');
        if (arrow) {
            arrow.style.transform = `translate(-50%, -100%) rotate(${currentHeading}deg)`;
        }
    }

    async function performSearch(query) {
        if (!query) return;
        try {
            const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
            const data = await response.json();
            
            if (data && data.length > 0) {
                const result = data[0];
                const latlng = [parseFloat(result.lat), parseFloat(result.lon)];
                
                if (searchMarker) map.removeLayer(searchMarker);
                searchMarker = L.marker(latlng, { icon: searchPinIcon }).addTo(map);
                
                searchMarker.bindPopup(`
                    <div class="p-2">
                        <h4 class="font-bold text-slate-800 text-xs">${result.display_name.split(',')[0]}</h4>
                        <p class="text-[10px] text-slate-500 mt-1">Location Found</p>
                    </div>
                `, { closeButton: false }).openPopup();

                map.flyTo(latlng, 14);

                if (currentMode === 'mobile') {
                    const sidebar = document.getElementById('sidebar');
                    if (!sidebar.classList.contains('is-collapsed')) toggleSidebarCollapse();
                }
            }
        } catch (err) {
            console.error("Search failed:", err);
        }
    }

    document.getElementById('global-search').onkeydown = (e) => {
        if (e.key === 'Enter') performSearch(e.target.value);
    };

    function calculateDistance(points) {
        let total = 0;
        for (let i = 0; i < points.length - 1; i++) {
            total += L.latLng(points[i]).distanceTo(L.latLng(points[i+1]));
        }
        return (total * 0.000621371).toFixed(2);
    }

    function calculateRemaining(currentPos, routePoints) {
        if (!currentPos || routePoints.length < 2) return 0;
        let nearestIdx = 0, minDist = Infinity;
        routePoints.forEach((pt, idx) => {
            const d = L.latLng(currentPos).distanceTo(L.latLng(pt));
            if (d < minDist) { minDist = d; nearestIdx = idx; }
        });
        let remainingMeters = L.latLng(currentPos).distanceTo(L.latLng(routePoints[nearestIdx]));
        for (let i = nearestIdx; i < routePoints.length - 1; i++) {
            remainingMeters += L.latLng(routePoints[i]).distanceTo(L.latLng(routePoints[i+1]));
        }
        return (remainingMeters * 0.000621371);
    }

    window.enterDriveMode = (id) => {
        const r = savedRoutes.find(x => x.id === id);
        if (!r) return;
        currentDriveRoute = r;
        isDriving = true;
        document.getElementById('drive-hud').classList.remove('hidden');
        window.viewRoute(id);
        if (lastKnownPos) map.flyTo(lastKnownPos, 18);
        if (currentMode === 'mobile') {
            const sidebar = document.getElementById('sidebar');
            if (!sidebar.classList.contains('is-collapsed')) toggleSidebarCollapse();
        }
        updateHUD();
    };

    function exitDriveMode() {
        isDriving = false;
        currentDriveRoute = null;
        document.getElementById('drive-hud').classList.add('hidden');
        if (activeViewLine) map.removeLayer(activeViewLine);
        activeViewLine = null;
    }

    function updateHUD() {
        if (!isDriving || !currentDriveRoute || !lastKnownPos) return;
        const miles = calculateRemaining(lastKnownPos, currentDriveRoute.path);
        document.getElementById('hud-miles').innerText = miles.toFixed(2) + " Mi";
        
        const carMins = Math.max(1, Math.round((miles / 30) * 60));
        const bikeMins = Math.max(1, Math.round((miles / 12) * 60));
        const walkMins = Math.max(1, Math.round((miles / 3) * 60));

        document.getElementById('hud-time-car').innerText = carMins + "m";
        document.getElementById('hud-time-bike').innerText = bikeMins + "m";
        document.getElementById('hud-time-walk').innerText = walkMins + "m";
    }

    function setTheme(theme) {
        currentTheme = theme;
        localStorage.setItem('theme', theme);
        const html = document.documentElement;
        const lightBtn = document.getElementById('theme-light-btn');
        const darkBtn = document.getElementById('theme-dark-btn');
        if (theme === 'dark') {
            html.classList.add('dark');
            darkBtn.className = "py-3 rounded-xl text-[10px] font-black uppercase transition-all bg-indigo-600 text-white shadow-lg";
            lightBtn.className = "py-3 rounded-xl text-[10px] font-black uppercase transition-all text-slate-400";
        } else {
            html.classList.remove('dark');
            lightBtn.className = "py-3 rounded-xl text-[10px] font-black uppercase transition-all bg-white text-indigo-600 shadow-sm";
            darkBtn.className = "py-3 rounded-xl text-[10px] font-black uppercase transition-all text-slate-400 dark:text-slate-500";
        }
    }
    setTheme(currentTheme);

    function toggleSettings() {
        document.getElementById('settings-panel').classList.toggle('translate-x-full');
    }

    // === NEW: Device Orientation (Compass) Handling ===
    function setupCompass() {
        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', (event) => {
                if (event.alpha !== null) {
                    // alpha is the compass direction (0 = North)
                    currentHeading = event.alpha;
                    updateCompass();
                }
            });
        } else {
            // Desktop fallback: slowly rotate compass for demo
            console.log("%cCompass: DeviceOrientation not supported (desktop fallback)", "color:#64748b");
            let fakeHeading = 0;
            setInterval(() => {
                fakeHeading = (fakeHeading + 0.8) % 360;
                currentHeading = fakeHeading;
                updateCompass();
            }, 80);
        }
    }

    window.onload = () => {
        let prog = 0;
        const bar = document.getElementById('boot-progress');
        const interval = setInterval(() => {
            prog += Math.random() * 25;
            if(prog > 100) prog = 100;
            bar.style.width = prog + '%';
            if(prog >= 100) {
                clearInterval(interval);
                setTimeout(showSelection, 300);
            }
        }, 100);
    };

    function showSelection() {
        const boot = document.getElementById('boot-screen');
        const selection = document.getElementById('selection-screen');
        boot.classList.add('opacity-0', 'pointer-events-none');
        setTimeout(() => {
            boot.classList.add('hidden');
            selection.classList.remove('hidden');
            setTimeout(() => selection.classList.remove('opacity-0'), 50);
        }, 700);
    }

    function selectMode(mode) {
        currentMode = mode;
        const selection = document.getElementById('selection-screen');
        const loader = document.getElementById('loading-screen');
        selection.classList.add('opacity-0', 'pointer-events-none');
        setTimeout(() => {
            selection.classList.add('hidden');
            loader.classList.remove('hidden');
            document.body.className += ` mode-${mode}`;
            setTimeout(() => loader.classList.remove('opacity-0'), 50);
            startMapLoading(mode);
        }, 500);
    }

    function startMapLoading(mode) {
        let prog = 0;
        const bar = document.getElementById('progress-bar');
        const interval = setInterval(() => {
            prog += 10;
            bar.style.width = prog + '%';
            if(prog >= 100) {
                clearInterval(interval);
                finishLoading(mode);
            }
        }, 50);
    }

    function finishLoading(mode) {
        const loader = document.getElementById('loading-screen');
        const app = document.getElementById('app-interface');
        loader.classList.add('opacity-0', 'pointer-events-none');
        setTimeout(() => {
            loader.classList.add('hidden');
            app.classList.remove('opacity-0', 'pointer-events-none');
            initMap(mode);
            updateSavedList();
        }, 500);
    }

    function initMap(mode) {
        const fallback = [40.7128, -74.0060];
        map = L.map('map', { 
            zoomControl: mode === 'desktop',
            attributionControl: false,
            tap: true
        }).setView(fallback, 13);

        const lightLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            className: 'map-tile-light'
        });

        const satelliteImagery = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}');
        const labelsOverlay = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png');
        const satelliteGroup = L.layerGroup([satelliteImagery, labelsOverlay]);

        lightLayer.addTo(map);

        const baseMaps = {
            "Street": lightLayer,
            "Satellite": satelliteGroup
        };

        L.control.layers(baseMaps, null, { position: 'topleft' }).addTo(map);

        polyline = L.polyline([], { color: '#6366f1', weight: 4, dashArray: '5, 10' }).addTo(map);
        
        const customIcon = L.divIcon({
            className: 'custom-div-icon',
            html: '<div class="pulse-ring"></div><div class="user-location-marker" style="width: 14px; height: 14px; position: relative; z-index: 10;"></div>',
            iconSize: [14, 14],
            iconAnchor: [7, 7]
        });

        userMarker = L.marker(fallback, { icon: customIcon }).addTo(map);

        // === Initialize Compass ===
        createCompassControl();
        setupCompass();

        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const latlng = [pos.coords.latitude, pos.coords.longitude];
                    updateLocation(latlng);
                    if (!initialRecenterDone) {
                        map.flyTo(latlng, 15);
                        initialRecenterDone = true;
                    }
                },
                () => handleGPSBlocked(),
                { enableHighAccuracy: true }
            );

            navigator.geolocation.watchPosition(
                (pos) => {
                    const latlng = [pos.coords.latitude, pos.coords.longitude];
                    updateLocation(latlng);
                    if (isDriving) {
                        map.panTo(latlng);
                        updateHUD();
                    }
                },
                null,
                { enableHighAccuracy: true }
            );
        }

        map.on('click', (e) => {
            if (!isDrawing) return;
            
            if (startAtLocation && routePath.length === 0 && lastKnownPos) {
                routePath.push(lastKnownPos);
                const startMarker = L.circleMarker(lastKnownPos, { 
                    radius: 4, color: '#6366f1', fillOpacity: 1 
                }).addTo(map);
                markers.push(startMarker);
            }

            routePath.push([e.latlng.lat, e.latlng.lng]);
            
            const m = L.circleMarker(e.latlng, { 
                radius: 6, color: '#6366f1', fillColor: 'white', fillOpacity: 1, weight: 3 
            }).addTo(map);
            
            markers.push(m);
            polyline.setLatLngs(routePath);
            document.getElementById('point-count').innerText = calculateDistance(routePath) + " Mi Total";
        });
    }

    function updateLocation(latlng) {
        lastKnownPos = latlng;
        if (userMarker) userMarker.setLatLng(latlng);
        document.getElementById('tracking-status').className = "w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.5)]";
        document.getElementById('gps-label').innerText = "Live GPS";
        document.getElementById('gps-label').className = "text-[9px] font-black text-emerald-500 uppercase";

        if (!document.getElementById('weather-icon').src) {
            loadWeatherIcon();
        }
    }

    function handleGPSBlocked() {
        document.getElementById('tracking-status').className = "w-2 h-2 rounded-full bg-rose-500";
        document.getElementById('gps-label').innerText = "GPS Blocked";
    }

    function recenter() {
        if (lastKnownPos) map.flyTo(lastKnownPos, 15);
    }

    // ... (rest of your existing functions remain the same: new-route-btn, cancel, save, delete, viewRoute, updateSavedList, loadWeatherIcon, etc.)

    document.getElementById('new-route-btn').onclick = () => {
        isDrawing = true;
        routePath = [];
        markers.forEach(m => map.removeLayer(m));
        markers = [];
        polyline.setLatLngs([]);
        document.getElementById('new-route-btn').classList.add('hidden');
        document.getElementById('active-controls').classList.remove('hidden');
        document.getElementById('point-count').innerText = "0.00 Mi Total";
    };

    document.getElementById('cancel-draft-btn').onclick = () => {
        isDrawing = false;
        markers.forEach(m => map.removeLayer(m));
        markers = [];
        polyline.setLatLngs([]);
        document.getElementById('new-route-btn').classList.remove('hidden');
        document.getElementById('active-controls').classList.add('hidden');
    };

    document.getElementById('end-route-btn').onclick = () => {
        if (routePath.length < 2) return;
        const dist = calculateDistance(routePath);
        document.getElementById('modal-dist').innerText = `Total Distance: ${dist} miles`;
        document.getElementById('name-modal').classList.remove('hidden');
    };

    document.getElementById('close-modal-btn').onclick = () => {
        document.getElementById('name-modal').classList.add('hidden');
    };

    document.getElementById('confirm-save-btn').onclick = () => {
        const name = document.getElementById('route-name-input').value || "Unnamed Route";
        const newRoute = {
            id: Date.now(),
            name: name,
            distance: calculateDistance(routePath),
            path: routePath,
            date: new Date().toLocaleDateString()
        };
        savedRoutes.push(newRoute);
        localStorage.setItem('saved_routes', JSON.stringify(savedRoutes));
        updateSavedList();
        
        isDrawing = false;
        markers.forEach(m => map.removeLayer(m));
        markers = [];
        polyline.setLatLngs([]);
        document.getElementById('new-route-btn').classList.remove('hidden');
        document.getElementById('active-controls').classList.add('hidden');
        document.getElementById('name-modal').classList.add('hidden');
        document.getElementById('route-name-input').value = "";
    };

    window.deleteRoute = (id) => {
        savedRoutes = savedRoutes.filter(r => r.id !== id);
        localStorage.setItem('saved_routes', JSON.stringify(savedRoutes));
        updateSavedList();
        if (activeViewLine) map.removeLayer(activeViewLine);
    };

    window.viewRoute = (id) => {
        const r = savedRoutes.find(x => x.id === id);
        if (!r) return;
        if (activeViewLine) map.removeLayer(activeViewLine);
        activeViewLine = L.polyline(r.path, { color: '#db2777', weight: 6, opacity: 0.8 }).addTo(map);
        map.fitBounds(activeViewLine.getBounds(), { padding: [50, 50] });
    };

    function updateSavedList() {
        const list = document.getElementById('saved-routes-list');
        list.innerHTML = "";
        [...savedRoutes].reverse().forEach(r => {
            const div = document.createElement('div');
            div.className = "bg-slate-50 dark:bg-slate-800/50 p-4 rounded-2xl border border-slate-100 dark:border-slate-800 hover:border-indigo-200 dark:hover:border-indigo-900 transition-all group";
            div.innerHTML = `
                <div class="flex justify-between items-start mb-2">
                    <div>
                        <h4 class="text-xs font-black uppercase dark:text-white">${r.name}</h4>
                        <p class="text-[9px] font-bold text-slate-400 mt-0.5">${r.date} • ${r.distance} Mi</p>
                    </div>
                    <button onclick="deleteRoute(${r.id})" class="text-slate-300 hover:text-rose-500 transition-colors opacity-0 group-hover:opacity-100">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                </div>
                <div class="flex gap-2 mt-3">
                    <button onclick="viewRoute(${r.id})" class="flex-grow bg-white dark:bg-slate-700 py-2 rounded-xl text-[9px] font-black uppercase border border-slate-200 dark:border-slate-600 dark:text-white">View</button>
                    <button onclick="enterDriveMode(${r.id})" class="flex-grow bg-indigo-600 text-white py-2 rounded-xl text-[9px] font-black uppercase shadow-lg shadow-indigo-500/20">Go</button>
                </div>
            `;
            list.appendChild(div);
        });
    }

    async function loadWeatherIcon() {
        if (!lastKnownPos) return;
        try {
            const [lat, lon] = lastKnownPos;
            const apiKey = '150ba377c3ca4474889150133260503';
            const weatherRes = await fetch(
                `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${apiKey}`
            );
            if (!weatherRes.ok) return;

            const data = await weatherRes.json();
            const iconCode = data.weather?.[0]?.icon;
            if (iconCode) {
                const iconUrl = `https://openweathermap.org/img/wn/${iconCode}@2x.png`;
                document.getElementById('weather-icon').src = iconUrl;
                document.getElementById('weather-indicator').classList.remove('hidden');
            }
        } catch (err) {
            console.log("Weather icon fetch failed (silent)", err);
        }
    }

    setTimeout(() => {
        if (lastKnownPos && !document.getElementById('weather-icon').src) {
            loadWeatherIcon();
        }
    }, 4000);
</script>
