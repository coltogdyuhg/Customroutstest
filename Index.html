<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CustomRoutes - Navigator Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        darkCard: '#1e293b'
                    }
                }
            }
        }
    </script>

    <style>
        :root { --header-h: 64px; }
        #map { height: calc(100vh - var(--header-h)); width: 100%; background: #0f172a; z-index: 1; }
        
        .mode-mobile #sidebar {
            position: fixed; bottom: 0; left: 0; width: 100% !important;
            height: auto !important; z-index: 50;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 2rem 2rem 0 0;
        }
        .mode-mobile #sidebar.is-collapsed { transform: translateY(calc(100% - 70px)); }
        .mode-desktop #sidebar { width: 22rem; height: 100%; }

        .gradient-header { background: linear-gradient(90deg, #4f46e5 0%, #7c3aed 50%, #db2777 100%); }
        .hero-pattern {
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }

        .user-location-marker { background: #4f46e5; border: 3px solid white; border-radius: 50%; box-shadow: 0 0 10px rgba(0,0,0,0.2); }
        .user-direction-arrow {
            position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent;
            border-bottom: 10px solid #4f46e5; filter: drop-shadow(0 -2px 2px rgba(0,0,0,0.2));
        }

        .pulse-ring {
            position: absolute; top: 50%; left: 50%; width: 14px; height: 14px;
            margin-top: -7px; margin-left: -7px; border-radius: 50%;
            background: rgba(79, 70, 229, 0.4); animation: pulse-animation 2s infinite;
        }
        @keyframes pulse-animation { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(4); opacity: 0; } }

        .leaflet-container { background: transparent !important; }
        .dark .map-tile-light { filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3); }

        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #4f46e5; }
        input:checked + .slider:before { transform: translateX(20px); }

        .nav-card { transition: all 0.3s ease; border: 2px solid transparent; }
        .nav-card.active { border-color: #4f46e5; background: rgba(79, 70, 229, 0.1); }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 overflow-hidden font-sans text-slate-900 transition-colors duration-300">

    <div id="drive-hud" class="fixed top-20 right-4 z-[2000] hidden transition-all duration-500 scale-90 origin-top-right">
        <div class="bg-slate-900/90 text-white rounded-3xl p-4 shadow-2xl flex items-center gap-6 border border-white/10 backdrop-blur-md">
            <div class="flex flex-col border-r border-white/10 pr-4">
                <span class="text-[8px] font-black uppercase tracking-widest text-indigo-400">Heading</span>
                <span id="hud-heading" class="text-lg font-black italic tabular-nums">--</span>
            </div>
            <div class="flex flex-col border-r border-white/10 pr-4">
                <span class="text-[8px] font-black uppercase tracking-widest text-indigo-400">Remaining</span>
                <span id="hud-miles" class="text-lg font-black italic tabular-nums">0.00 Mi</span>
            </div>
            <button onclick="exitDriveMode()" class="bg-rose-500/20 text-rose-500 p-2 rounded-xl hover:bg-rose-500 hover:text-white transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
    </div>

    <div id="nav-menu" class="fixed inset-0 z-[3000] hidden flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
        <div class="bg-white dark:bg-slate-900 w-full max-w-lg rounded-[2.5rem] overflow-hidden shadow-2xl border border-slate-200 dark:border-slate-800">
            <div class="p-8 space-y-6">
                <div class="flex justify-between items-center">
                    <h3 class="text-2xl font-black italic uppercase tracking-tighter dark:text-white">Quick Navigate</h3>
                    <button onclick="toggleNavMenu()" class="text-slate-400 hover:text-rose-500"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
                </div>

                <div class="space-y-4">
                    <div class="relative">
                        <input id="nav-destination" type="text" placeholder="Where to?" class="w-full p-5 bg-slate-100 dark:bg-slate-800 rounded-2xl text-sm font-bold border-none outline-none focus:ring-2 ring-indigo-500 dark:text-white">
                    </div>

                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                        <button onclick="selectVehicle('car')" id="v-car" class="nav-card p-4 rounded-2xl bg-slate-50 dark:bg-slate-800 flex flex-col items-center gap-2">
                            <span class="text-xl">🚗</span>
                            <span class="text-[10px] font-black uppercase dark:text-white">Car</span>
                        </button>
                        <button onclick="selectVehicle('bike')" id="v-bike" class="nav-card p-4 rounded-2xl bg-slate-50 dark:bg-slate-800 flex flex-col items-center gap-2">
                            <span class="text-xl">🚲</span>
                            <span class="text-[10px] font-black uppercase dark:text-white">Bike</span>
                        </button>
                        <button onclick="selectVehicle('ebike')" id="v-ebike" class="nav-card p-4 rounded-2xl bg-slate-50 dark:bg-slate-800 flex flex-col items-center gap-2">
                            <span class="text-xl">⚡</span>
                            <span class="text-[10px] font-black uppercase dark:text-white">E-Bike</span>
                        </button>
                        <button onclick="selectVehicle('escooter')" id="v-escooter" class="nav-card p-4 rounded-2xl bg-slate-50 dark:bg-slate-800 flex flex-col items-center gap-2">
                            <span class="text-xl">🛴</span>
                            <span class="text-[10px] font-black uppercase dark:text-white">Scooter</span>
                        </button>
                    </div>

                    <div id="ebike-options" class="hidden animate-fade-in">
                        <label class="text-[10px] font-black text-indigo-500 uppercase tracking-widest mb-2 block">Max Assist Speed</label>
                        <select id="ebike-speed" class="w-full p-4 bg-slate-100 dark:bg-slate-800 rounded-xl text-xs font-bold dark:text-white outline-none">
                            <option value="15">Class 1 (15-20 mph) - Quiet Paths</option>
                            <option value="28">Class 3 (28 mph) - Road Commute</option>
                            <option value="45">Hyper E-Bike (45+ mph) - Flow with Traffic</option>
                        </select>
                    </div>
                </div>

                <button onclick="startNavigation()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-5 rounded-2xl font-black uppercase tracking-widest shadow-xl shadow-indigo-500/20 transition-all">
                    Start Route
                </button>
            </div>
        </div>
    </div>

    <div id="boot-screen" class="fixed inset-0 z-[300] flex flex-col items-center justify-center p-6 text-center transition-all duration-700">
        <div class="absolute inset-0 hero-pattern bg-slate-950"></div>
        <div class="relative max-w-md w-full space-y-8">
            <div class="w-16 h-16 bg-indigo-600 rounded-2xl mx-auto flex items-center justify-center animate-bounce shadow-2xl">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            </div>
            <h2 class="text-3xl font-black text-white italic uppercase tracking-tighter">CustomRoutes</h2>
            <div class="relative w-full bg-white/5 h-1.5 rounded-full overflow-hidden">
                <div id="boot-progress" class="h-full bg-indigo-500 w-0 transition-all duration-200"></div>
            </div>
        </div>
    </div>

    <div id="app-interface" class="opacity-0 pointer-events-none transition-opacity duration-1000 flex flex-col h-screen">
        <header class="h-16 gradient-header flex items-center justify-between px-6 shadow-lg z-30 shrink-0">
            <h1 class="text-white font-black text-xl tracking-tighter italic uppercase">CustomRoutes</h1>
            
            <button onclick="toggleNavMenu()" class="bg-white/20 hover:bg-white/30 text-white px-6 py-2 rounded-full text-[10px] font-black uppercase tracking-widest border border-white/30 backdrop-blur-md">
                Where To?
            </button>

            <div class="flex items-center gap-2">
                <div id="weather-indicator" class="hidden w-8 h-8 flex items-center justify-center rounded-full bg-white/10 border border-white/20">
                    <img id="weather-icon" src="" class="w-6 h-6">
                </div>
            </div>
        </header>

        <main id="main-container" class="flex flex-grow overflow-hidden relative">
            <div id="sidebar" class="bg-white dark:bg-slate-900 shadow-2xl flex flex-col z-20 border-r border-slate-100 dark:border-slate-800">
                <div id="sidebar-scrollable" class="overflow-y-auto flex-grow p-5 space-y-4">
                    <button id="new-route-btn" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black uppercase text-xs shadow-lg shadow-indigo-500/20">
                        + Manual Draw
                    </button>
                    
                    <div id="active-controls" class="hidden space-y-2">
                        <div class="bg-indigo-50 dark:bg-slate-800 p-4 rounded-2xl border-2 border-indigo-100 dark:border-indigo-900/30">
                            <span id="point-count" class="text-[10px] font-black text-indigo-600 block mb-3 uppercase">0.00 Mi</span>
                            <div class="grid grid-cols-2 gap-2">
                                <button id="end-route-btn" class="bg-emerald-500 text-white py-3 rounded-xl font-black text-[10px] uppercase">Save</button>
                                <button id="cancel-draft-btn" class="bg-rose-500 text-white py-3 rounded-xl font-black text-[10px] uppercase">Cancel</button>
                            </div>
                        </div>
                    </div>

                    <div class="pt-4">
                        <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">History</h3>
                        <div id="saved-routes-list" class="space-y-3"></div>
                    </div>
                </div>
            </div>

            <div id="map-area" class="flex-grow relative">
                <div id="map"></div>
            </div>
        </main>
    </div>

    <script>
        let map, polyline, markers = [], routePath = [];
        let userMarker = null, lastKnownPos = null;
        let isDrawing = false, isDriving = false;
        let selectedVehicle = 'car';
        let activeNavLine = null;
        let savedRoutes = JSON.parse(localStorage.getItem('saved_routes')) || [];

        // --- CORE NAVIGATION LOGIC ---

        function toggleNavMenu() {
            const menu = document.getElementById('nav-menu');
            menu.classList.toggle('hidden');
        }

        function selectVehicle(type) {
            selectedVehicle = type;
            document.querySelectorAll('.nav-card').forEach(c => c.classList.remove('active'));
            document.getElementById(`v-${type}`).classList.add('active');
            
            const ebikeOpt = document.getElementById('ebike-options');
            type === 'ebike' ? ebikeOpt.classList.remove('hidden') : ebikeOpt.classList.add('hidden');
        }

        async function startNavigation() {
            const dest = document.getElementById('nav-destination').value;
            if (!dest || !lastKnownPos) return alert("Please enter destination and enable GPS");

            try {
                // 1. Geocode destination
                const geoRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(dest)}`);
                const geoData = await geoRes.json();
                if (!geoData.length) return alert("Location not found");
                
                const endPos = [parseFloat(geoData[0].lat), parseFloat(geoData[0].lon)];
                
                // 2. Fetch Route (using OSRM - for production use a private instance or Google/Mapbox)
                // Profile logic based on your request
                let profile = 'car'; // default
                if (selectedVehicle === 'bike' || selectedVehicle === 'ebike' || selectedVehicle === 'escooter') {
                    profile = 'bicycle';
                }

                const routeRes = await fetch(`https://router.project-osrm.org/route/v1/${profile}/${lastKnownPos[1]},${lastKnownPos[0]};${endPos[1]},${endPos[0]}?overview=full&geometries=geojson`);
                const routeData = await routeRes.json();
                
                if (routeData.routes && routeData.routes.length > 0) {
                    const coords = routeData.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
                    
                    // Safety check for Scooters / Low Speed EBikes: Avoid Motorways/Primary roads
                    // In a real app, you'd use a routing engine like Valhalla that supports "avoid_roads"
                    
                    if (activeNavLine) map.removeLayer(activeNavLine);
                    
                    activeNavLine = L.polyline(coords, {
                        color: selectedVehicle === 'car' ? '#4f46e5' : '#10b981',
                        weight: 6,
                        opacity: 0.8
                    }).addTo(map);

                    map.fitBounds(activeNavLine.getBounds(), { padding: [50, 50] });
                    toggleNavMenu();
                    
                    // Trigger HUD
                    isDriving = true;
                    document.getElementById('drive-hud').classList.remove('hidden');
                    updateHUD(routeData.routes[0].distance);
                }
            } catch (e) {
                console.error(e);
                alert("Routing failed. Try a different location.");
            }
        }

        function updateHUD(meters) {
            const miles = (meters * 0.000621371).toFixed(2);
            document.getElementById('hud-miles').innerText = miles + " Mi";
        }

        function exitDriveMode() {
            isDriving = false;
            document.getElementById('drive-hud').classList.add('hidden');
            if (activeNavLine) map.removeLayer(activeNavLine);
        }

        // --- MAP INITIALIZATION ---

        function initMap() {
            map = L.map('map', { zoomControl: false, attributionControl: false }).setView([40.7128, -74.0060], 13);
            
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                className: 'map-tile-light'
            }).addTo(map);

            const userIcon = L.divIcon({
                className: 'custom-icon',
                html: `<div class="pulse-ring"></div><div class="user-location-marker" style="width:14px;height:14px;"></div>`,
                iconSize: [14,14], iconAnchor: [7,7]
            });

            userMarker = L.marker([40.7128, -74.0060], { icon: userIcon }).addTo(map);

            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(pos => {
                    lastKnownPos = [pos.coords.latitude, pos.coords.longitude];
                    userMarker.setLatLng(lastKnownPos);
                    if (!map._initialCenter) {
                        map.setView(lastKnownPos, 15);
                        map._initialCenter = true;
                    }
                });
            }
        }

        // --- SYSTEM BOOT ---
        window.onload = () => {
            let prog = 0;
            const bar = document.getElementById('boot-progress');
            const interval = setInterval(() => {
                prog += Math.random() * 30;
                if(prog > 100) prog = 100;
                bar.style.width = prog + '%';
                if(prog >= 100) {
                    clearInterval(interval);
                    document.getElementById('boot-screen').classList.add('opacity-0', 'pointer-events-none');
                    document.getElementById('app-interface').classList.remove('opacity-0', 'pointer-events-none');
                    initMap();
                    selectVehicle('car');
                }
            }, 150);
        };
    </script>
</body>
</html>
