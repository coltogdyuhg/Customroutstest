<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CustomRoutes - Navigator Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        darkCard: '#1e293b'
                    }
                }
            }
        }

    <style>
        :root { --header-h: 64px; }
        #map { height: calc(100vh - var(--header-h)); width: 100%; background: #0f172a; z-index: 1; }
        
        .mode-mobile #sidebar {
            position: fixed; bottom: 0; left: 0; width: 100% !important;
            height: auto !important; z-index: 50;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 2rem 2rem 0 0;
        }
        .mode-mobile #sidebar.is-collapsed { transform: translateY(calc(100% - 70px)); }
        .mode-desktop #sidebar { width: 22rem; height: 100%; }

        .gradient-header { background: linear-gradient(90deg, #4f46e5 0%, #7c3aed 50%, #db2777 100%); }
        .hero-pattern {
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }

        .user-location-marker { background: #4f46e5; border: 3px solid white; border-radius: 50%; box-shadow: 0 0 10px rgba(0,0,0,0.2); }
        .pulse-ring {
            position: absolute; top: 50%; left: 50%; width: 14px; height: 14px;
            margin-top: -7px; margin-left: -7px; border-radius: 50%;
            background: rgba(79, 70, 229, 0.4); animation: pulse-animation 2s infinite;
        }
        @keyframes pulse-animation { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(4); opacity: 0; } }

        .search-pin-drop { animation: pin-drop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pin-drop { 0% { transform: translateY(-40px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .leaflet-container { background: transparent !important; }
        .dark .map-tile-light { filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3); }
        .dark .leaflet-container { background: #0f172a !important; }

        #mobile-drag-handle { display: none; }
        .mode-mobile #mobile-drag-handle { display: flex; }

        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #4f46e5; }
        input:checked + .slider:before { transform: translateX(20px); }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 overflow-hidden font-sans text-slate-900 transition-colors duration-300">

    <div id="smart-route-modal" class="fixed inset-0 z-[3000] hidden flex items-center justify-center p-6 bg-slate-950/60 backdrop-blur-sm">
        <div class="bg-white dark:bg-slate-800 w-full max-w-sm rounded-[2.5rem] p-8 shadow-2xl space-y-6 border border-slate-200 dark:border-slate-700">
            <div class="space-y-2 text-center">
                <h3 class="text-xl font-black italic uppercase tracking-tighter dark:text-white">Where To?</h3>
                <p class="text-[9px] text-indigo-500 font-bold uppercase tracking-widest">Select your vehicle & destination</p>
            </div>
            
            <div class="space-y-4">
                <input id="destination-input" type="text" placeholder="Enter destination..." class="w-full p-4 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl text-xs font-bold outline-none focus:ring-2 ring-indigo-500 dark:text-white">
                
                <div class="space-y-2">
                    <label class="text-[10px] font-black text-slate-400 uppercase ml-2">Vehicle Type</label>
                    <select id="vehicle-type" onchange="toggleSpeedInput()" class="w-full p-4 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl text-xs font-bold outline-none focus:ring-2 ring-indigo-500 dark:text-white appearance-none">
                        <option value="car">Car</option>
                        <option value="ebike">E-Bike</option>
                        <option value="escooter">E-Scooter (Safety Mode)</option>
                        <option value="bike">Normal Bike</option>
                    </select>
                </div>

                <div id="ebike-speed-box" class="hidden space-y-2 animate-fade-in">
                    <label class="text-[10px] font-black text-emerald-500 uppercase ml-2">Max Speed (MPH)</label>
                    <select id="ebike-speed" class="w-full p-4 bg-emerald-50 dark:bg-emerald-900/20 border border-emerald-100 dark:border-emerald-800 rounded-2xl text-xs font-bold outline-none dark:text-white">
                        <option value="15">Low (Up to 15 mph)</option>
                        <option value="25">Medium (Up to 25 mph)</option>
                        <option value="35">High (28+ mph - Road Logic)</option>
                    </select>
                </div>
            </div>

            <div class="flex gap-3">
                <button onclick="generateSmartRoute()" class="flex-grow bg-indigo-600 text-white py-4 rounded-2xl font-black uppercase text-[10px] tracking-widest shadow-lg shadow-indigo-500/20">Generate Route</button>
                <button onclick="toggleSmartModal()" class="px-6 bg-slate-100 dark:bg-slate-700 text-slate-400 dark:text-slate-300 py-4 rounded-2xl font-black uppercase text-[10px]">Cancel</button>
            </div>
        </div>
    </div>

    <div id="app-interface" class="flex flex-col h-screen">
        <header class="h-16 gradient-header flex items-center justify-between px-6 shadow-lg z-30 shrink-0">
            <h1 class="text-white font-black text-xl tracking-tighter italic uppercase">CustomRoutes</h1>
            <div id="weather-indicator" class="hidden w-7 h-7 flex items-center justify-center rounded-full bg-white/10 border border-white/20">
                <img id="weather-icon" src="" alt="Weather" class="w-5 h-5 opacity-90">
            </div>
        </header>

        <main id="main-container" class="flex flex-grow overflow-hidden relative">
            <div id="sidebar" class="bg-white dark:bg-slate-900 shadow-2xl flex flex-col z-20 border-r border-slate-100 dark:border-slate-800">
                <div id="mobile-drag-handle" onclick="toggleSidebarCollapse()" class="flex flex-col items-center justify-center py-2 bg-slate-50 dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 cursor-pointer">
                    <div id="sidebar-chevron" class="transition-transform duration-300 transform rotate-0"><svg class="w-6 h-6 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg></div>
                </div>

                <div class="p-5 space-y-4">
                    <button onclick="toggleSmartModal()" class="w-full bg-emerald-500 text-white py-4 rounded-2xl hover:bg-emerald-400 font-black uppercase tracking-widest text-xs shadow-lg shadow-emerald-500/20 transition-all">
                        🚀 Where To?
                    </button>
                    
                    <button id="new-route-btn" class="w-full bg-indigo-600 text-white py-4 rounded-2xl hover:bg-indigo-500 font-black uppercase tracking-widest text-xs shadow-lg shadow-indigo-500/20 transition-all">
                        + Draw Route
                    </button>
                    
                    <div id="active-controls" class="hidden space-y-2">
                        <div class="bg-indigo-50 dark:bg-slate-800 border-2 border-indigo-100 dark:border-indigo-900/30 p-4 rounded-2xl flex flex-col gap-3">
                            <span id="point-count" class="text-[10px] font-black text-indigo-600 dark:text-indigo-400 uppercase">0.00 Mi Total</span>
                            <div class="grid grid-cols-2 gap-2">
                                <button id="end-route-btn" class="bg-emerald-500 text-white py-3 rounded-xl font-black text-[10px] uppercase">Save</button>
                                <button id="cancel-draft-btn" class="bg-white dark:bg-slate-700 text-rose-500 dark:text-rose-400 py-3 rounded-xl font-black text-[10px] uppercase">Cancel</button>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div id="sidebar-scrollable" class="overflow-y-auto flex-grow p-5 pb-20">
                    <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-4">Saved Paths</h3>
                    <div id="saved-routes-list" class="space-y-3"></div>
                </div>
            </div>

            <div id="map-area" class="flex-grow relative">
                <div id="map"></div>
            </div>
        </main>
    </div>

    <div id="drive-hud" class="fixed top-20 right-4 z-[2000] hidden transition-all duration-500 scale-90 origin-top-right">
        <div class="bg-slate-900/90 text-white rounded-3xl p-4 shadow-2xl flex items-center gap-6 border border-white/10 backdrop-blur-md">
            <div class="flex flex-col border-r border-white/10 pr-4">
                <span class="text-[8px] font-black uppercase tracking-widest text-indigo-400">Distance</span>
                <span id="hud-miles" class="text-lg font-black italic tabular-nums">0.00 Mi</span>
            </div>
            <button onclick="exitDriveMode()" class="bg-rose-500/20 text-rose-500 p-2 rounded-xl">X</button>
        </div>
    </div>

    <div id="name-modal" class="fixed inset-0 z-[1000] hidden flex items-center justify-center p-6 bg-slate-950/60 backdrop-blur-sm">
        <div class="bg-white dark:bg-slate-800 w-full max-w-sm rounded-[2.5rem] p-8 shadow-2xl space-y-6">
            <h3 class="text-xl font-black italic uppercase dark:text-white">Name Your Route</h3>
            <input id="route-name-input" type="text" class="w-full p-4 bg-slate-50 dark:bg-slate-900 rounded-2xl text-xs font-bold outline-none dark:text-white">
            <button id="confirm-save-btn" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black uppercase">Save Path</button>
        </div>
    </div>

    <script>
        let map, polyline, markers = [], routePath = [];
        let isDrawing = false, userMarker = null, lastKnownPos = null;
        let savedRoutes = JSON.parse(localStorage.getItem('saved_routes')) || [];
        let activeViewLine = null;

        function initMap() {
            const fallback = [40.7128, -74.0060];
            map = L.map('map', { zoomControl: false, attributionControl: false }).setView(fallback, 13);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);
            polyline = L.polyline([], { color: '#6366f1', weight: 4 }).addTo(map);
            
            userMarker = L.marker(fallback, {
                icon: L.divIcon({
                    className: 'custom-icon',
                    html: '<div class="pulse-ring"></div><div class="user-location-marker" style="width:14px;height:14px"></div>',
                    iconSize: [14, 14]
                })
            }).addTo(map);

            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition((pos) => {
                    lastKnownPos = [pos.coords.latitude, pos.coords.longitude];
                    userMarker.setLatLng(lastKnownPos);
                });
            }
        }

        // --- NEW SMART ROUTING FUNCTIONS ---

        function toggleSmartModal() {
            document.getElementById('smart-route-modal').classList.toggle('hidden');
        }

        function toggleSpeedInput() {
            const type = document.getElementById('vehicle-type').value;
            const speedBox = document.getElementById('ebike-speed-box');
            speedBox.classList.toggle('hidden', type !== 'ebike');
        }

        async function generateSmartRoute() {
            const destName = document.getElementById('destination-input').value;
            const vehicle = document.getElementById('vehicle-type').value;
            const speed = document.getElementById('ebike-speed').value;

            if (!destName || !lastKnownPos) return alert("Please enter destination and allow GPS.");

            // 1. Find Destination Coordinates
            const searchRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(destName)}`);
            const searchData = await searchRes.json();
            if (!searchData.length) return alert("Location not found.");
            
            const destCoord = [searchData[0].lon, searchData[0].lat];
            const startCoord = [lastKnownPos[1], lastKnownPos[0]];

            // 2. Set Profile based on safety requirements
            let profile = 'cycling-regular'; // Default bike
            if (vehicle === 'car' || (vehicle === 'ebike' && speed > 30)) profile = 'driving-car';
            if (vehicle === 'escooter') profile = 'cycling-road'; // Prefers paved/safer paths

            // 3. Fetch Route (Using OSRM Public API)
            try {
                const routeRes = await fetch(`https://router.project-osrm.org/route/v1/${profile === 'driving-car' ? 'driving' : 'cycling'}/${startCoord[0]},${startCoord[1]};${destCoord[0]},${destCoord[1]}?overview=full&geometries=geojson`);
                const routeData = await routeRes.json();
                
                if (routeData.routes.length) {
                    const coords = routeData.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
                    
                    // Clear and set new route
                    routePath = coords;
                    polyline.setLatLngs(routePath);
                    map.fitBounds(polyline.getBounds(), { padding: [40, 40] });
                    
                    // Show save options
                    document.getElementById('new-route-btn').classList.add('hidden');
                    document.getElementById('active-controls').classList.remove('hidden');
                    document.getElementById('point-count').innerText = (routeData.routes[0].distance * 0.000621371).toFixed(2) + " Mi Total";
                    
                    toggleSmartModal();
                }
            } catch (e) {
                alert("Routing failed. Try a different location.");
            }
        }

        // --- Maintain original functionality ---
        document.getElementById('new-route-btn').onclick = () => {
            isDrawing = true;
            routePath = [];
            polyline.setLatLngs([]);
            document.getElementById('new-route-btn').classList.add('hidden');
            document.getElementById('active-controls').classList.remove('hidden');
        };

        document.getElementById('end-route-btn').onclick = () => {
            document.getElementById('name-modal').classList.remove('hidden');
        };

        document.getElementById('confirm-save-btn').onclick = () => {
            const name = document.getElementById('route-name-input').value || "Smart Route";
            savedRoutes.push({ id: Date.now(), name, path: routePath, distance: (polyline.getLatLngs().length * 0.1).toFixed(2), date: new Date().toLocaleDateString() });
            localStorage.setItem('saved_routes', JSON.stringify(savedRoutes));
            updateSavedList();
            document.getElementById('name-modal').classList.add('hidden');
            document.getElementById('active-controls').classList.add('hidden');
            document.getElementById('new-route-btn').classList.remove('hidden');
        };

        function updateSavedList() {
            const list = document.getElementById('saved-routes-list');
            list.innerHTML = "";
            savedRoutes.forEach(r => {
                const div = document.createElement('div');
                div.className = "bg-slate-50 dark:bg-slate-800 p-4 rounded-2xl border border-slate-100 dark:border-slate-800";
                div.innerHTML = `<h4 class="text-xs font-black dark:text-white uppercase">${r.name}</h4><p class="text-[9px] text-slate-400">${r.distance} Mi</p>`;
                list.appendChild(div);
            });
        }

        window.onload = () => { initMap(); updateSavedList(); };
    </script>
</body>

            <div id="sidebar" class="bg-white dark:bg-slate-900 shadow-2xl flex flex-col z-20 border-r border-slate-100 dark:border-slate-800">

                    <div id="sidebar-chevron" class="transition-transform duration-300 transform rotate-0"><svg class="w-6 h-6 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg></div>
                </div>

                <div class="p-5 space-y-4">
                    <button onclick="toggleSmartModal()" class="w-full bg-emerald-500 text-white py-4 rounded-2xl hover:bg-emerald-400 font-black uppercase tracking-widest text-xs shadow-lg shadow-emerald-500/20 transition-all">
                        🚀 Where To?
                    </button>
                    
                    <button id="new-route-btn" class="w-full bg-indigo-600 text-white py-4 rounded-2xl hover:bg-indigo-500 font-black uppercase tracking-widest text-xs shadow-lg shadow-indigo-500/20 transition-all">
                        + Draw Route
                    </button>
                    
                    <div id="active-controls" class="hidden space-y-2">
                        <div class="bg-indigo-50 dark:bg-slate-800 border-2 border-indigo-100 dark:border-indigo-900/30 p-4 rounded-2xl flex flex-col gap-3">
                            <span id="point-count" class="text-[10px] font-black text-indigo-600 dark:text-indigo-400 uppercase">0.00 Mi Total</span>
                            <div class="grid grid-cols-2 gap-2">
                                <button id="end-route-btn" class="bg-emerald-500 text-white py-3 rounded-xl font-black text-[10px] uppercase">Save</button>
                                <button id="cancel-draft-btn" class="bg-white dark:bg-slate-700 text-rose-500 dark:text-rose-400 py-3 rounded-xl font-black text-[10px] uppercase">Cancel</button>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div id="sidebar-scrollable" class="overflow-y-auto flex-grow p-5 pb-20">
                    <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-4">Saved Paths</h3>
                    <div id="saved-routes-list" class="space-y-3"></div>
                </div>
            </div>

            <div id="map-area" class="flex-grow relative">
                <div id="map"></div>
            </div>
        </main>
    </div>

    <div id="drive-hud" class="fixed top-20 right-4 z-[2000] hidden transition-all duration-500 scale-90 origin-top-right">
        <div class="bg-slate-900/90 text-white rounded-3xl p-4 shadow-2xl flex items-center gap-6 border border-white/10 backdrop-blur-md">
            <div class="flex flex-col border-r border-white/10 pr-4">
                <span class="text-[8px] font-black uppercase tracking-widest text-indigo-400">Distance</span>
                <span id="hud-miles" class="text-lg font-black italic tabular-nums">0.00 Mi</span>
            </div>
            <button onclick="exitDriveMode()" class="bg-rose-500/20 text-rose-500 p-2 rounded-xl">X</button>
        </div>
    </div>

    <div id="name-modal" class="fixed inset-0 z-[1000] hidden flex items-center justify-center p-6 bg-slate-950/60 backdrop-blur-sm">
        <div class="bg-white dark:bg-slate-800 w-full max-w-sm rounded-[2.5rem] p-8 shadow-2xl space-y-6">
            <h3 class="text-xl font-black italic uppercase dark:text-white">Name Your Route</h3>
            <input id="route-name-input" type="text" class="w-full p-4 bg-slate-50 dark:bg-slate-900 rounded-2xl text-xs font-bold outline-none dark:text-white">
            <button id="confirm-save-btn" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black uppercase">Save Path</button>
        </div>
    </div>

    <script>
        let map, polyline, markers = [], routePath = [];
        let isDrawing = false, userMarker = null, lastKnownPos = null;
        let savedRoutes = JSON.parse(localStorage.getItem('saved_routes')) || [];
        let activeViewLine = null;

        function initMap() {
            const fallback = [40.7128, -74.0060];
            map = L.map('map', { zoomControl: false, attributionControl: false }).setView(fallback, 13);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);
            polyline = L.polyline([], { color: '#6366f1', weight: 4 }).addTo(map);
            
            userMarker = L.marker(fallback, {
                icon: L.divIcon({
                    className: 'custom-icon',
                    html: '<div class="pulse-ring"></div><div class="user-location-marker" style="width:14px;height:14px"></div>',
                    iconSize: [14, 14]
                })
            }).addTo(map);

            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition((pos) => {
                    lastKnownPos = [pos.coords.latitude, pos.coords.longitude];
                    userMarker.setLatLng(lastKnownPos);
                });
            }
        }

        // --- NEW SMART ROUTING FUNCTIONS ---

        function toggleSmartModal() {
            document.getElementById('smart-route-modal').classList.toggle('hidden');
        }

        function toggleSpeedInput() {
            const type = document.getElementById('vehicle-type').value;
            const speedBox = document.getElementById('ebike-speed-box');
            speedBox.classList.toggle('hidden', type !== 'ebike');
        }

        async function generateSmartRoute() {
            const destName = document.getElementById('destination-input').value;
            const vehicle = document.getElementById('vehicle-type').value;
            const speed = document.getElementById('ebike-speed').value;

            if (!destName || !lastKnownPos) return alert("Please enter destination and allow GPS.");

            // 1. Find Destination Coordinates
            const searchRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(destName)}`);
            const searchData = await searchRes.json();
            if (!searchData.length) return alert("Location not found.");
            
            const destCoord = [searchData[0].lon, searchData[0].lat];
            const startCoord = [lastKnownPos[1], lastKnownPos[0]];

            // 2. Set Profile based on safety requirements
            let profile = 'cycling-regular'; // Default bike
            if (vehicle === 'car' || (vehicle === 'ebike' && speed > 30)) profile = 'driving-car';
            if (vehicle === 'escooter') profile = 'cycling-road'; // Prefers paved/safer paths

            // 3. Fetch Route (Using OSRM Public API)
            try {
                const routeRes = await fetch(`https://router.project-osrm.org/route/v1/${profile === 'driving-car' ? 'driving' : 'cycling'}/${startCoord[0]},${startCoord[1]};${destCoord[0]},${destCoord[1]}?overview=full&geometries=geojson`);
                const routeData = await routeRes.json();
                
                if (routeData.routes.length) {
                    const coords = routeData.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
                    
                    // Clear and set new route
                    routePath = coords;
                    polyline.setLatLngs(routePath);
                    map.fitBounds(polyline.getBounds(), { padding: [40, 40] });
                    
                    // Show save options
                    document.getElementById('new-route-btn').classList.add('hidden');
                    document.getElementById('active-controls').classList.remove('hidden');
                    document.getElementById('point-count').innerText = (routeData.routes[0].distance * 0.000621371).toFixed(2) + " Mi Total";
                    
                    toggleSmartModal();
                }
            } catch (e) {
                alert("Routing failed. Try a different location.");
            }
        }

        // --- Maintain original functionality ---
        document.getElementById('new-route-btn').onclick = () => {
            isDrawing = true;
            routePath = [];
            polyline.setLatLngs([]);
            document.getElementById('new-route-btn').classList.add('hidden');
            document.getElementById('active-controls').classList.remove('hidden');
        };

        document.getElementById('end-route-btn').onclick = () => {
            document.getElementById('name-modal').classList.remove('hidden');
        };

        document.getElementById('confirm-save-btn').onclick = () => {
            const name = document.getElementById('route-name-input').value || "Smart Route";
            savedRoutes.push({ id: Date.now(), name, path: routePath, distance: (polyline.getLatLngs().length * 0.1).toFixed(2), date: new Date().toLocaleDateString() });
            localStorage.setItem('saved_routes', JSON.stringify(savedRoutes));
            updateSavedList();
            document.getElementById('name-modal').classList.add('hidden');
            document.getElementById('active-controls').classList.add('hidden');
            document.getElementById('new-route-btn').classList.remove('hidden');
        };

        function updateSavedList() {
            const list = document.getElementById('saved-routes-list');
            list.innerHTML = "";
            savedRoutes.forEach(r => {
                const div = document.createElement('div');
                div.className = "bg-slate-50 dark:bg-slate-800 p-4 rounded-2xl border border-slate-100 dark:border-slate-800";
                div.innerHTML = `<h4 class="text-xs font-black dark:text-white uppercase">${r.name}</h4><p class="text-[9px] text-slate-400">${r.distance} Mi</p>`;
                list.appendChild(div);
            });
        }

        window.onload = () => { initMap(); updateSavedList(); };
    </script>
</body>
</html>
