<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CustomRoutes - Navigator Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        darkCard: '#1e293b'
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-out',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(-10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        :root { --header-h: 64px; }
        #map { height: calc(100vh - var(--header-h)); width: 100%; background: #0f172a; z-index: 1; }
        
        .mode-mobile #sidebar {
            position: fixed; bottom: 0; left: 0; width: 100% !important;
            height: auto !important; z-index: 50;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 2rem 2rem 0 0;
        }
        .mode-mobile #sidebar.is-collapsed { transform: translateY(calc(100% - 70px)); }
        .mode-desktop #sidebar { width: 22rem; height: 100%; }

        .gradient-header { background: linear-gradient(90deg, #4f46e5 0%, #7c3aed 50%, #db2777 100%); }
        .hero-pattern {
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }

        .user-location-marker { background: #4f46e5; border: 3px solid white; border-radius: 50%; box-shadow: 0 0 10px rgba(0,0,0,0.2); }
        .user-direction-arrow {
            position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent;
            border-bottom: 10px solid #4f46e5; filter: drop-shadow(0 -2px 2px rgba(0,0,0,0.2));
        }

        .pulse-ring {
            position: absolute; top: 50%; left: 50%; width: 14px; height: 14px; margin-top: -7px; margin-left: -7px;
            border-radius: 50%; background: rgba(79, 70, 229, 0.4); animation: pulse-animation 2s infinite;
        }
        @keyframes pulse-animation { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(4); opacity: 0; } }

        .search-pin-drop { animation: pin-drop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pin-drop { 0% { transform: translateY(-40px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark .map-tile-light { filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3); }

        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #4f46e5; }
        input:checked + .slider:before { transform: translateX(20px); }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 overflow-hidden font-sans text-slate-900 transition-colors duration-300">

    <div id="smart-route-modal" class="fixed inset-0 z-[2100] hidden flex items-center justify-center p-6 bg-slate-950/70 backdrop-blur-md">
        <div class="bg-white dark:bg-slate-800 w-full max-w-md rounded-[2.5rem] p-8 shadow-2xl space-y-6 border border-slate-200 dark:border-slate-700">
            <div class="flex justify-between items-center">
                <h3 class="text-xl font-black italic uppercase tracking-tighter dark:text-white">Smart Navigator</h3>
                <button onclick="closeSmartModal()" class="text-slate-400 hover:text-rose-500">✕</button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 block">Destination</label>
                    <input id="smart-dest-input" type="text" placeholder="Address or Place..." class="w-full p-4 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl text-xs font-bold outline-none focus:ring-2 ring-indigo-500 dark:text-white">
                </div>
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 block">Vehicle Type</label>
                    <select id="vehicle-select" onchange="toggleEbikeSpeed(this.value)" class="w-full p-4 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl text-xs font-bold outline-none dark:text-white">
                        <option value="car">Car (Fastest)</option>
                        <option value="ebike">E-Bike</option>
                        <option value="escooter">E-Scooter</option>
                        <option value="bike">Normal Bike</option>
                    </select>
                </div>
                <div id="ebike-speed-container" class="hidden animate-fade-in">
                    <label class="text-[10px] font-black text-indigo-500 uppercase tracking-widest mb-2 block">Max Speed Cap</label>
                    <select id="ebike-speed" class="w-full p-4 bg-indigo-50 dark:bg-slate-900 border border-indigo-200 dark:border-slate-700 rounded-2xl text-xs font-bold outline-none dark:text-white">
                        <option value="15">15 MPH</option>
                        <option value="20">20 MPH</option>
                        <option value="28">28 MPH</option>
                    </select>
                </div>
            </div>
            <button onclick="calculateSmartRoute()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black uppercase text-[10px] tracking-widest shadow-lg shadow-indigo-500/20 hover:bg-indigo-500 transition-all">Go On Road</button>
        </div>
    </div>

    <div id="drive-hud" class="fixed top-20 right-4 z-[2000] hidden transition-all duration-500 scale-90 origin-top-right">
        <div class="bg-slate-900/90 text-white rounded-3xl p-4 shadow-2xl flex items-center gap-6 border border-white/10 backdrop-blur-md">
            <div class="flex flex-col border-r border-white/10 pr-4">
                <span class="text-[8px] font-black uppercase tracking-widest text-indigo-400">Heading</span>
                <span id="hud-heading" class="text-lg font-black italic tabular-nums">--</span>
            </div>
            <div class="flex flex-col border-r border-white/10 pr-4">
                <span class="text-[8px] font-black uppercase tracking-widest text-indigo-400">Distance</span>
                <span id="hud-miles" class="text-lg font-black italic tabular-nums">0.00 Mi</span>
            </div>
            <div class="flex gap-4">
                <div class="flex flex-col items-center">
                    <span class="text-[8px] font-black uppercase tracking-widest text-indigo-400">Time</span>
                    <span id="hud-time-active" class="text-sm font-black italic tabular-nums">--m</span>
                </div>
            </div>
            <button onclick="exitDriveMode()" class="bg-rose-500/20 text-rose-500 p-2 rounded-xl hover:bg-rose-500 hover:text-white transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
    </div>

    <div id="name-modal" class="fixed inset-0 z-[1000] hidden flex items-center justify-center p-6 bg-slate-950/60 backdrop-blur-sm">
        <div class="bg-white dark:bg-slate-800 w-full max-w-sm rounded-[2.5rem] p-8 shadow-2xl space-y-6 border border-slate-200 dark:border-slate-700">
            <div class="space-y-2">
                <h3 class="text-xl font-black italic uppercase tracking-tighter dark:text-white">Save Route</h3>
                <p id="modal-dist" class="text-[10px] text-indigo-500 font-bold uppercase tracking-widest"></p>
            </div>
            <input id="route-name-input" type="text" placeholder="Name..." class="w-full p-4 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl text-xs font-bold outline-none dark:text-white">
            <div class="flex gap-3">
                <button id="confirm-save-btn" class="flex-grow bg-indigo-600 text-white py-4 rounded-2xl font-black uppercase text-[10px] tracking-widest shadow-lg">Save</button>
                <button onclick="document.getElementById('name-modal').classList.add('hidden')" class="px-6 bg-slate-100 dark:bg-slate-700 text-slate-400 py-4 rounded-2xl font-black uppercase text-[10px]">Cancel</button>
            </div>
        </div>
    </div>

    <div id="settings-panel" class="fixed inset-y-0 right-0 w-full md:w-80 bg-white dark:bg-slate-900 z-[1100] translate-x-full transition-transform duration-300 ease-in-out shadow-2xl border-l border-slate-200 dark:border-slate-800">
        <div class="h-16 flex items-center justify-between px-6 border-b border-slate-100 dark:border-slate-800">
            <h3 class="text-xs font-black uppercase tracking-widest dark:text-white">Settings</h3>
            <button onclick="toggleSettings()" class="text-slate-400 hover:text-rose-500">✕</button>
        </div>
        <div class="p-6 space-y-8">
            <div class="space-y-4">
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Theme</label>
                <div class="grid grid-cols-2 gap-2 p-1 bg-slate-100 dark:bg-slate-800 rounded-2xl">
                    <button onclick="setTheme('light')" class="py-3 rounded-xl text-[10px] font-black uppercase">Light</button>
                    <button onclick="setTheme('dark')" class="py-3 rounded-xl text-[10px] font-black uppercase">Dark</button>
                </div>
            </div>
        </div>
    </div>

    <div id="boot-screen" class="fixed inset-0 z-[300] flex flex-col items-center justify-center p-6 text-center transition-all duration-700">
        <div class="absolute inset-0 hero-pattern bg-slate-950"></div>
        <div class="relative max-w-md w-full space-y-8">
            <h2 class="text-3xl font-black text-white italic uppercase tracking-tighter">CustomRoutes</h2>
            <div class="relative w-full bg-white/5 h-1.5 rounded-full overflow-hidden border border-white/5">
                <div id="boot-progress" class="h-full bg-indigo-500 w-0 transition-all duration-200 ease-out"></div>
            </div>
        </div>
    </div>

    <div id="selection-screen" class="fixed inset-0 z-[200] hidden flex flex-col items-center justify-center p-6 transition-all duration-500 opacity-0">
        <div class="absolute inset-0 hero-pattern bg-slate-950"></div>
        <div class="relative z-10 w-full max-w-xl text-center space-y-8">
            <h1 class="text-4xl font-black text-white italic uppercase tracking-tighter">Choose Interface</h1>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <button onclick="selectMode('desktop')" class="p-8 bg-white/5 border border-white/10 rounded-[2.5rem] text-white font-black uppercase text-sm">Desktop</button>
                <button onclick="selectMode('mobile')" class="p-8 bg-white/5 border border-white/10 rounded-[2.5rem] text-white font-black uppercase text-sm">Mobile</button>
            </div>
        </div>
    </div>

    <div id="loading-screen" class="fixed inset-0 z-[100] hidden flex flex-col items-center justify-center p-6 text-center transition-all duration-500 opacity-0">
        <div class="absolute inset-0 hero-pattern bg-slate-950"></div>
        <div class="relative max-w-md w-full space-y-10">
            <h2 class="text-2xl font-black text-white italic uppercase tracking-tighter">Syncing GPS</h2>
            <div class="relative w-full bg-white/5 h-2 rounded-full overflow-hidden border border-white/5">
                <div id="progress-bar" class="h-full bg-gradient-to-r from-indigo-500 to-pink-500 w-0 transition-all duration-300"></div>
            </div>
        </div>
    </div>

    <div id="app-interface" class="opacity-0 pointer-events-none transition-opacity duration-1000 flex flex-col h-screen">
        <header class="h-16 gradient-header flex items-center justify-between px-6 shadow-lg z-30 shrink-0">
            <h1 class="text-white font-black text-xl tracking-tighter italic uppercase">CustomRoutes</h1>
            <div class="flex flex-grow max-w-md mx-4 relative">
                <input id="global-search" type="text" placeholder="Search..." class="w-full bg-white/10 border border-white/20 rounded-full py-2 px-10 text-xs text-white placeholder-white/60 outline-none focus:bg-white/20">
                <svg class="w-4 h-4 absolute left-4 top-1/2 -translate-y-1/2 text-white/60" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
            <button onclick="toggleSettings()" class="bg-white/10 text-white p-2.5 rounded-full">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path></svg>
            </button>
        </header>

        <main id="main-container" class="flex flex-grow overflow-hidden relative">
            <div id="sidebar" class="bg-white dark:bg-slate-900 shadow-2xl flex flex-col z-20 border-r border-slate-100 dark:border-slate-800">
                <div id="sidebar-scrollable" class="overflow-y-auto flex-grow">
                    <div class="p-5 space-y-4 border-b border-slate-100 dark:border-slate-800">
                        <button onclick="openSmartModal()" class="w-full bg-slate-900 dark:bg-white dark:text-slate-900 text-white py-4 rounded-2xl font-black uppercase text-xs">Where To?</button>
                        <button id="new-route-btn" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black uppercase text-xs">+ Draw Route</button>
                        <div id="active-controls" class="hidden space-y-2">
                            <div class="bg-indigo-50 dark:bg-slate-800 p-4 rounded-2xl flex flex-col gap-3">
                                <span id="point-count" class="text-[10px] font-black text-indigo-600 uppercase">0.00 Mi Total</span>
                                <div class="grid grid-cols-2 gap-2">
                                    <button id="end-route-btn" class="bg-emerald-500 text-white py-3 rounded-xl font-black text-[10px] uppercase">Save</button>
                                    <button id="cancel-draft-btn" class="bg-slate-200 py-3 rounded-xl font-black text-[10px] uppercase">Cancel</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="p-5">
                        <h3 class="text-[10px] font-black text-slate-400 uppercase mb-4">Saved Paths</h3>
                        <div id="saved-routes-list" class="space-y-3"></div>
                    </div>
                </div>
            </div>
            <div id="map-area" class="flex-grow relative">
                <div id="map"></div>
            </div>
        </main>
    </div>

    <script>
        let map, polyline, markers = [], routePath = [];
        let isDrawing = false, userMarker = null, searchMarker = null;
        let savedRoutes = JSON.parse(localStorage.getItem('saved_routes')) || [];
        let lastKnownPos = null;
        let activeViewLine = null;
        let isDriving = false;
        let currentDriveRoute = null;
        let userHeading = 0;

        /* SMART ROUTE LOGIC - STREET SNAPPING */
        function openSmartModal() { document.getElementById('smart-route-modal').classList.remove('hidden'); }
        function closeSmartModal() { document.getElementById('smart-route-modal').classList.add('hidden'); }
        function toggleEbikeSpeed(val) { document.getElementById('ebike-speed-container').classList.toggle('hidden', val !== 'ebike'); }

        async function calculateSmartRoute() {
            const dest = document.getElementById('smart-dest-input').value;
            const vehicle = document.getElementById('vehicle-select').value;
            const speed = document.getElementById('ebike-speed').value;

            if (!dest || !lastKnownPos) return alert("Wait for GPS and enter destination");
            closeSmartModal();

            try {
                const searchRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(dest)}`);
                const searchData = await searchRes.json();
                if (searchData.length === 0) return alert("Not found");
                
                const dLat = parseFloat(searchData[0].lat), dLon = parseFloat(searchData[0].lon);
                let profile = (vehicle === 'car') ? 'driving' : 'cycling';

                // OSRM Street Routing API
                const routeRes = await fetch(`https://router.project-osrm.org/route/v1/${profile}/${lastKnownPos[1]},${lastKnownPos[0]};${dLon},${dLat}?overview=full&geometries=geojson`);
                const routeData = await routeRes.json();

                if (routeData.code !== 'Ok') return alert("Road path unavailable");

                const roadCoords = routeData.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
                const distMiles = (routeData.routes[0].distance * 0.000621371).toFixed(2);

                if (activeViewLine) map.removeLayer(activeViewLine);
                activeViewLine = L.polyline(roadCoords, { color: '#6366f1', weight: 6 }).addTo(map);
                map.fitBounds(activeViewLine.getBounds());

                currentDriveRoute = { id: Date.now(), path: roadCoords, distance: distMiles, vehicle, maxSpeed: speed };
                isDriving = true;
                document.getElementById('drive-hud').classList.remove('hidden');
                updateHUD();
            } catch (err) { console.error(err); }
        }

        function updateHUD() {
            if (!isDriving || !currentDriveRoute || !lastKnownPos) return;
            const end = currentDriveRoute.path[currentDriveRoute.path.length - 1];
            const milesLeft = (L.latLng(lastKnownPos).distanceTo(L.latLng(end)) * 0.000621371);
            
            document.getElementById('hud-miles').innerText = milesLeft.toFixed(2) + " Mi";
            document.getElementById('hud-heading').innerText = getCardinal(userHeading);
            
            let speed = (currentDriveRoute.vehicle === 'car') ? 30 : (currentDriveRoute.vehicle === 'bike' ? 12 : 18);
            if (currentDriveRoute.vehicle === 'ebike') speed = parseInt(currentDriveRoute.maxSpeed);
            
            document.getElementById('hud-time-active').innerText = Math.max(1, Math.round((milesLeft / speed) * 60)) + "m";

            // Battery Logic
            if (currentDriveRoute.vehicle !== 'car' && currentDriveRoute.vehicle !== 'bike') {
                const battUsed = Math.round(milesLeft * 2.5); 
                document.getElementById('hud-heading').innerHTML = `<span class="text-emerald-400">⚡${battUsed}%</span>`;
            }
        }

        /* CORE MAP LOGIC */
        function initMap() {
            const fallback = [40.7128, -74.0060];
            map = L.map('map', { zoomControl: false, attributionControl: false }).setView(fallback, 13);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { className: 'map-tile-light' }).addTo(map);

            const customIcon = L.divIcon({
                className: 'custom-div-icon',
                html: `<div id="marker-orient"><div class="user-direction-arrow"></div><div class="pulse-ring"></div><div class="user-location-marker" style="width: 14px; height: 14px;"></div></div>`,
                iconSize: [14, 14], iconAnchor: [7, 7]
            });
            userMarker = L.marker(fallback, { icon: customIcon }).addTo(map);

            navigator.geolocation.watchPosition((pos) => {
                lastKnownPos = [pos.coords.latitude, pos.coords.longitude];
                userMarker.setLatLng(lastKnownPos);
                if (isDriving) { map.panTo(lastKnownPos); updateHUD(); }
            }, null, { enableHighAccuracy: true });

            polyline = L.polyline([], { color: '#6366f1', weight: 4 }).addTo(map);
            map.on('click', (e) => {
                if (!isDrawing) return;
                routePath.push([e.latlng.lat, e.latlng.lng]);
                polyline.setLatLngs(routePath);
                document.getElementById('point-count').innerText = calculateDistance(routePath) + " Mi Total";
            });
        }

        function calculateDistance(pts) {
            let d = 0;
            for(let i=0; i<pts.length-1; i++) d += L.latLng(pts[i]).distanceTo(L.latLng(pts[i+1]));
            return (d * 0.000621371).toFixed(2);
        }

        function getCardinal(angle) { return ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'][Math.round(angle / 45) % 8]; }
        function exitDriveMode() { isDriving = false; document.getElementById('drive-hud').classList.add('hidden'); if(activeViewLine) map.removeLayer(activeViewLine); }
        function toggleSettings() { document.getElementById('settings-panel').classList.toggle('translate-x-full'); }
        function setTheme(t) { document.documentElement.classList.toggle('dark', t === 'dark'); }

        window.onload = () => {
            let prog = 0; const bar = document.getElementById('boot-progress');
            const int = setInterval(() => {
                prog += 25; bar.style.width = prog + '%';
                if(prog >= 100) { clearInterval(int); showSelection(); }
            }, 100);
        };

        function showSelection() { document.getElementById('boot-screen').classList.add('hidden'); document.getElementById('selection-screen').classList.remove('hidden'); setTimeout(() => document.getElementById('selection-screen').classList.remove('opacity-0'), 50); }
        function selectMode(m) {
            document.getElementById('selection-screen').classList.add('hidden');
            document.getElementById('loading-screen').classList.remove('hidden', 'opacity-0');
            document.body.className += ` mode-${m}`;
            setTimeout(() => { document.getElementById('loading-screen').classList.add('hidden'); document.getElementById('app-interface').classList.remove('opacity-0', 'pointer-events-none'); initMap(); updateSavedList(); }, 1000);
        }

        document.getElementById('new-route-btn').onclick = () => { isDrawing = true; routePath = []; polyline.setLatLngs([]); document.getElementById('new-route-btn').classList.add('hidden'); document.getElementById('active-controls').classList.remove('hidden'); };
        document.getElementById('end-route-btn').onclick = () => { document.getElementById('modal-dist').innerText = calculateDistance(routePath) + " miles"; document.getElementById('name-modal').classList.remove('hidden'); };
        document.getElementById('confirm-save-btn').onclick = () => {
            savedRoutes.push({ id: Date.now(), name: document.getElementById('route-name-input').value || "Path", path: routePath, distance: calculateDistance(routePath) });
            localStorage.setItem('saved_routes', JSON.stringify(savedRoutes));
            updateSavedList();
            isDrawing = false; document.getElementById('name-modal').classList.add('hidden'); document.getElementById('new-route-btn').classList.remove('hidden'); document.getElementById('active-controls').classList.add('hidden');
        };

        function updateSavedList() {
            const list = document.getElementById('saved-routes-list');
            list.innerHTML = "";
            savedRoutes.forEach(r => {
                const div = document.createElement('div');
                div.className = "bg-slate-50 dark:bg-slate-800 p-4 rounded-2xl";
                div.innerHTML = `<h4 class="text-xs font-black uppercase dark:text-white">${r.name}</h4><p class="text-[9px] text-slate-400">${r.distance} Mi</p>`;
                list.appendChild(div);
            });
        }
    </script>
</body>
</html>
