<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CustomRoutes - Navigator Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet.js -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        darkCard: '#1e293b'
                    }
                }
            }
        }
    </script>

    <style>
        :root { --header-h: 64px; }
        #map { height: calc(100vh - var(--header-h)); width: 100%; background: #0f172a; z-index: 1; }
        
        /* Mobile Sidebar Styles */
        .mode-mobile #sidebar {
            position: fixed; bottom: 0; left: 0; width: 100% !important;
            height: auto !important; 
            z-index: 50;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 2rem 2rem 0 0;
        }

        .mode-mobile #sidebar.is-collapsed {
            transform: translateY(calc(100% - 70px));
        }

        .mode-desktop #sidebar { width: 22rem; height: 100%; }

        .gradient-header { background: linear-gradient(90deg, #4f46e5 0%, #7c3aed 50%, #db2777 100%); }
        .hero-pattern {
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }

        .user-location-marker {
            background: #4f46e5; 
            border: 3px solid white; 
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }
        .pulse-ring {
            position: absolute;
            top: 50%; left: 50%;
            width: 14px; height: 14px;
            margin-top: -7px; margin-left: -7px;
            border-radius: 50%;
            background: rgba(79, 70, 229, 0.4);
            animation: pulse-animation 2s infinite;
        }
        @keyframes pulse-animation {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(4); opacity: 0; }
        }

        .search-pin-drop {
            animation: pin-drop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes pin-drop {
            0% { transform: translateY(-40px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        /* === NEW: Compass Styles === */
        #compass-container {
            position: absolute;
            bottom: 90px;
            left: 20px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(99, 102, 241, 0.3);
            border-radius: 9999px;
            padding: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }
        #compass {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: radial-gradient(circle, #1e2937 0%, #0f172a 100%);
            border: 3px solid #6366f1;
            position: relative;
            box-shadow: inset 0 0 20px rgba(99, 102, 241, 0.4),
                        0 0 25px rgba(99, 102, 241, 0.3);
        }
        #compass-arrow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 4px;
            height: 32px;
            background: linear-gradient(to bottom, #f43f5e, #e11d48);
            transform-origin: bottom center;
            border-radius: 9999px;
            box-shadow: 0 0 12px #f43f5e;
            transition: transform 0.15s ease-out;
        }
        #compass-arrow::after {
            content: '';
            position: absolute;
            top: -8px;
            left: -4px;
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-bottom: 10px solid #f43f5e;
        }
        #compass-heading {
            position: absolute;
            bottom: -22px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            font-weight: 900;
            color: #a5b4fc;
            letter-spacing: 1px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.6);
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        .leaflet-container { background: transparent !important; }
        .dark .map-tile-light { filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3); }
        .dark .leaflet-container { background: #0f172a !important; }

        #mobile-drag-handle { display: none; }
        .mode-mobile #mobile-drag-handle { display: flex; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 overflow-hidden font-sans text-slate-900 transition-colors duration-300">

    <!-- Drive Mode HUD Overlay -->
    <div id="drive-hud" class="fixed top-20 right-4 z-[2000] hidden transition-all duration-500 scale-90 origin-top-right">
        <div class="bg-slate-900/90 text-white rounded-3xl p-4 shadow-2xl flex items-center gap-6 border border-white/10 backdrop-blur-md">
            <div class="flex flex-col border-r border-white/10 pr-4">
                <span class="text-[8px] font-black uppercase tracking-widest text-indigo-400">Distance</span>
                <span id="hud-miles" class="text-lg font-black italic tabular-nums">0.00 Mi</span>
            </div>
            <div class="flex gap-4">
                <div class="flex flex-col items-center">
                    <span class="text-[8px] font-black uppercase tracking-widest text-indigo-400">Drive</span>
                    <span id="hud-time-car" class="text-sm font-black italic tabular-nums">--m</span>
                </div>
                <div class="flex flex-col items-center">
                    <span class="text-[8px] font-black uppercase tracking-widest text-emerald-400">Bike</span>
                    <span id="hud-time-bike" class="text-sm font-black italic tabular-nums">--m</span>
                </div>
                <div class="flex flex-col items-center">
                    <span class="text-[8px] font-black uppercase tracking-widest text-pink-400">Walk</span>
                    <span id="hud-time-walk" class="text-sm font-black italic tabular-nums">--m</span>
                </div>
            </div>
            <button onclick="exitDriveMode()" class="bg-rose-500/20 text-rose-500 p-2 rounded-xl hover:bg-rose-500 hover:text-white transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
    </div>

    <!-- Compass Indicator -->
    <div id="compass-container" class="hidden">
        <div id="compass">
            <div id="compass-arrow"></div>
        </div>
        <div id="compass-heading">N 0°</div>
    </div>

    <!-- Route Name Modal -->
    <div id="name-modal" class="fixed inset-0 z-[1000] hidden flex items-center justify-center p-6 bg-slate-950/60 backdrop-blur-sm">
        <div class="bg-white dark:bg-slate-800 w-full max-w-sm rounded-[2.5rem] p-8 shadow-2xl space-y-6 border border-slate-200 dark:border-slate-700">
            <div class="space-y-2">
                <h3 class="text-xl font-black italic uppercase tracking-tighter dark:text-white">Name Your Route</h3>
                <p id="modal-dist" class="text-[10px] text-indigo-500 font-bold uppercase tracking-widest">Total Distance: 0.00 miles</p>
            </div>
            <input id="route-name-input" type="text" placeholder="e.g. Morning Run" class="w-full p-4 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl text-xs font-bold outline-none focus:ring-2 ring-indigo-500 dark:text-white">
            <div class="flex gap-3">
                <button id="confirm-save-btn" class="flex-grow bg-indigo-600 text-white py-4 rounded-2xl font-black uppercase text-[10px] tracking-widest shadow-lg shadow-indigo-500/20">Save Path</button>
                <button id="close-modal-btn" class="px-6 bg-slate-100 dark:bg-slate-700 text-slate-400 dark:text-slate-300 py-4 rounded-2xl font-black uppercase text-[10px]">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Settings Sidebar -->
    <div id="settings-panel" class="fixed inset-y-0 right-0 w-full md:w-80 bg-white dark:bg-slate-900 z-[1100] translate-x-full transition-transform duration-300 ease-in-out shadow-2xl border-l border-slate-200 dark:border-slate-800">
        <div class="h-16 flex items-center justify-between px-6 border-b border-slate-100 dark:border-slate-800">
            <h3 class="text-xs font-black uppercase tracking-widest dark:text-white">System Settings</h3>
            <button onclick="toggleSettings()" class="text-slate-400 hover:text-rose-500 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <div class="p-6 space-y-8">
            <div class="space-y-4">
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Appearance</label>
                <div class="grid grid-cols-2 gap-2 p-1 bg-slate-100 dark:bg-slate-800 rounded-2xl">
                    <button onclick="setTheme('light')" id="theme-light-btn" class="py-3 rounded-xl text-[10px] font-black uppercase transition-all">Light</button>
                    <button onclick="setTheme('dark')" id="theme-dark-btn" class="py-3 rounded-xl text-[10px] font-black uppercase transition-all">Dark</button>
                </div>
            </div>
            
            <div class="space-y-4">
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Global Options</label>
                <div class="flex items-center justify-between p-4 bg-slate-50 dark:bg-slate-800 rounded-2xl">
                    <span class="text-[10px] font-black uppercase dark:text-white">Start at Location</span>
                    <label class="switch">
                        <input type="checkbox" id="settings-start-at-loc" onchange="syncToggles(this)">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <div class="pt-10 border-t border-slate-100 dark:border-slate-800 text-center">
                <p class="text-[9px] text-slate-400 font-bold uppercase">CustomRoutes v2.5.1</p>
            </div>
        </div>
    </div>

    <!-- Loading Screen + Selection Screen (unchanged) -->
    <!-- ... (keeping the rest of your original loading/selection screens) ... -->

    <!-- Main Interface -->
    <div id="app-interface" class="opacity-0 pointer-events-none transition-opacity duration-1000 flex flex-col h-screen">
        <header class="h-16 gradient-header flex items-center justify-between px-6 shadow-lg z-30 shrink-0">
            <div class="flex items-center gap-4">
                <h1 class="text-white font-black text-xl tracking-tighter italic uppercase">CustomRoutes</h1>
            </div>
            
            <div class="flex flex-grow max-w-md mx-4 md:mx-8 relative">
                <input id="global-search" type="text" placeholder="Search cities or places..." 
                    class="w-full bg-white/10 border border-white/20 rounded-full py-2 px-10 text-xs text-white placeholder-white/60 focus:bg-white/20 outline-none focus:ring-2 ring-white/30 transition-all">
                <svg class="w-4 h-4 absolute left-4 top-1/2 -translate-y-1/2 text-white/60" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>

            <div class="flex items-center gap-2">
                <button onclick="toggleSettings()" class="bg-white/10 hover:bg-white/20 text-white p-2.5 rounded-full border border-white/10 flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                </button>

                <div id="weather-indicator" class="hidden w-7 h-7 flex items-center justify-center rounded-full bg-white/10 border border-white/20">
                    <img id="weather-icon" src="" alt="Weather" class="w-5 h-5 opacity-90">
                </div>
            </div>
        </header>

        <main id="main-container" class="flex flex-grow overflow-hidden relative">
            <div id="sidebar" class="bg-white dark:bg-slate-900 shadow-2xl flex flex-col z-20 border-r border-slate-100 dark:border-slate-800">
                <!-- Sidebar content unchanged -->
                <div id="mobile-drag-handle" onclick="toggleSidebarCollapse()" class="flex flex-col items-center justify-center py-2 bg-slate-50 dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 cursor-pointer">
                    <div id="sidebar-chevron" class="transition-transform duration-300 transform rotate-0">
                        <svg class="w-6 h-6 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </div>
                </div>

                <div id="sidebar-scrollable" class="overflow-y-auto flex-grow h-[45vh] md:h-auto">
                    <!-- Your existing sidebar content -->
                    <div class="p-5 space-y-4 border-b border-slate-100 dark:border-slate-800">
                        <div class="flex items-center justify-between px-1 mb-2">
                             <span class="text-[9px] font-black uppercase tracking-widest text-slate-400">Start at my location</span>
                             <label class="switch">
                                <input type="checkbox" id="inline-start-at-loc" onchange="syncToggles(this)">
                                <span class="slider"></span>
                            </label>
                        </div>

                        <button id="new-route-btn" class="w-full bg-indigo-600 text-white py-4 rounded-2xl hover:bg-indigo-500 font-black uppercase tracking-widest text-xs shadow-lg shadow-indigo-500/20 transition-all">
                            + Draw Route
                        </button>
                        
                        <div id="active-controls" class="hidden space-y-2">
                            <div class="bg-indigo-50 dark:bg-slate-800 border-2 border-indigo-100 dark:border-indigo-900/30 p-4 rounded-2xl flex flex-col gap-3">
                                <div class="flex justify-between items-center">
                                    <span id="point-count" class="text-[10px] font-black text-indigo-600 dark:text-indigo-400 uppercase">0.00 Mi Total</span>
                                </div>
                                <div class="grid grid-cols-2 gap-2">
                                    <button id="end-route-btn" class="bg-emerald-500 text-white py-3 rounded-xl font-black text-[10px] uppercase">Save</button>
                                    <button id="cancel-draft-btn" class="bg-white dark:bg-slate-700 text-rose-500 dark:text-rose-400 py-3 rounded-xl font-black text-[10px] uppercase border border-rose-100 dark:border-none">Cancel</button>
                                </div>
                            </div>
                        </div>

                        <div class="bg-slate-50 dark:bg-slate-800/50 border border-slate-100 dark:border-slate-800 p-3 rounded-xl flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <div id="tracking-status" class="w-2 h-2 rounded-full bg-slate-300"></div>
                                <span id="gps-label" class="text-[9px] font-black text-slate-400 dark:text-slate-500 uppercase">Standby</span>
                            </div>
                            <button id="locate-me-btn" onclick="recenter()" class="text-indigo-600 dark:text-indigo-400 font-black text-[9px] uppercase hover:underline">Recenter</button>
                        </div>
                    </div>

                    <div class="p-5 pb-20">
                        <h3 class="text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-[0.2em] mb-4">Saved Paths</h3>
                        <div id="saved-routes-list" class="space-y-3"></div>
                    </div>
                </div>
            </div>

            <div id="map-area" class="flex-grow relative">
                <div id="map"></div>
                <button onclick="recenter()" id="floating-locate" class="absolute bottom-6 right-6 md:hidden z-[1000] bg-white dark:bg-slate-800 w-14 h-14 rounded-full shadow-2xl border border-slate-200 dark:border-slate-700 text-indigo-600 flex items-center justify-center">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"></path></svg>
                </button>
            </div>
        </main>
    </div>

    <script>
        // === Existing variables + new ones ===
        let map, polyline, markers = [], routePath = [];
        let isDrawing = false, userMarker = null, searchMarker = null;
        let savedRoutes = JSON.parse(localStorage.getItem('saved_routes')) || [];
        let lastKnownPos = null;
        let activeViewLine = null;
        let isDriving = false;
        let currentDriveRoute = null;
        let currentTheme = localStorage.getItem('theme') || 'light';
        let currentMode = 'desktop';
        let initialRecenterDone = false;
        let startAtLocation = false;
        let currentHeading = 0; // New: direction in degrees

        // === Sync toggles (unchanged) ===
        function syncToggles(el) {
            startAtLocation = el.checked;
            document.getElementById('settings-start-at-loc').checked = startAtLocation;
            document.getElementById('inline-start-at-loc').checked = startAtLocation;
        }

        function toggleSidebarCollapse() {
            const sidebar = document.getElementById('sidebar');
            const chevron = document.getElementById('sidebar-chevron');
            sidebar.classList.toggle('is-collapsed');
            chevron.style.transform = sidebar.classList.contains('is-collapsed') ? 'rotate(180deg)' : 'rotate(0deg)';
        }

        // === Compass Functions ===
        function updateCompass(heading) {
            currentHeading = heading || 0;
            const arrow = document.getElementById('compass-arrow');
            const text = document.getElementById('compass-heading');
            
            arrow.style.transform = `translate(-50%, -100%) rotate(${currentHeading}deg)`;
            
            const directions = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
            const index = Math.round(currentHeading / 45) % 8;
            text.textContent = `${directions[index]} ${Math.round(currentHeading)}°`;
        }

        function initCompass() {
            const compassContainer = document.getElementById('compass-container');
            compassContainer.classList.remove('hidden');

            // Use DeviceOrientation API (mobile)
            if (window.DeviceOrientationEvent) {
                window.addEventListener('deviceorientation', (event) => {
                    if (event.webkitCompassHeading !== undefined) {
                        updateCompass(event.webkitCompassHeading);
                    } else if (event.alpha !== null) {
                        // Fallback for some Android devices
                        const heading = 360 - event.alpha;
                        updateCompass(heading);
                    }
                });
            }

            // GPS heading fallback (when moving)
            // This will be updated from geolocation watchPosition
        }

        // === Rest of your existing functions (search, distance, drive mode, etc.) ===
        // ... (I kept all your original functions exactly the same, only adding compass logic) ...

        async function performSearch(query) { /* unchanged */ }
        function calculateDistance(points) { /* unchanged */ }
        function calculateRemaining(currentPos, routePoints) { /* unchanged */ }

        window.enterDriveMode = (id) => {
            const r = savedRoutes.find(x => x.id === id);
            if (!r) return;
            currentDriveRoute = r;
            isDriving = true;
            document.getElementById('drive-hud').classList.remove('hidden');
            window.viewRoute(id);
            if (lastKnownPos) map.flyTo(lastKnownPos, 18);
            if (currentMode === 'mobile') toggleSidebarCollapse();
            updateHUD();
        };

        function exitDriveMode() {
            isDriving = false;
            currentDriveRoute = null;
            document.getElementById('drive-hud').classList.add('hidden');
            if (activeViewLine) map.removeLayer(activeViewLine);
            activeViewLine = null;
        }

        function updateHUD() {
            if (!isDriving || !currentDriveRoute || !lastKnownPos) return;
            const miles = calculateRemaining(lastKnownPos, currentDriveRoute.path);
            document.getElementById('hud-miles').innerText = miles.toFixed(2) + " Mi";
            
            const carMins = Math.max(1, Math.round((miles / 30) * 60));
            const bikeMins = Math.max(1, Math.round((miles / 12) * 60));
            const walkMins = Math.max(1, Math.round((miles / 3) * 60));

            document.getElementById('hud-time-car').innerText = carMins + "m";
            document.getElementById('hud-time-bike').innerText = bikeMins + "m";
            document.getElementById('hud-time-walk').innerText = walkMins + "m";
        }

        function setTheme(theme) { /* unchanged */ }
        function toggleSettings() { /* unchanged */ }

        // Map initialization with compass
        function initMap(mode) {
            const fallback = [40.7128, -74.0060];
            map = L.map('map', { 
                zoomControl: mode === 'desktop',
                attributionControl: false,
                tap: true
            }).setView(fallback, 13);

            const lightLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                className: 'map-tile-light'
            });

            const satelliteImagery = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}');
            const labelsOverlay = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png');
            const satelliteGroup = L.layerGroup([satelliteImagery, labelsOverlay]);

            lightLayer.addTo(map);
            L.control.layers({ "Street": lightLayer, "Satellite": satelliteGroup }, null, { position: 'topleft' }).addTo(map);

            polyline = L.polyline([], { color: '#6366f1', weight: 4, dashArray: '5, 10' }).addTo(map);
            
            const customIcon = L.divIcon({
                className: 'custom-div-icon',
                html: '<div class="pulse-ring"></div><div class="user-location-marker" style="width: 14px; height: 14px; position: relative; z-index: 10;"></div>',
                iconSize: [14, 14],
                iconAnchor: [7, 7]
            });

            userMarker = L.marker(fallback, { icon: customIcon }).addTo(map);

            // GPS + Heading
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const latlng = [pos.coords.latitude, pos.coords.longitude];
                        updateLocation(latlng, pos.coords.heading);
                        if (!initialRecenterDone) {
                            map.flyTo(latlng, 15);
                            initialRecenterDone = true;
                        }
                    },
                    () => handleGPSBlocked(),
                    { enableHighAccuracy: true }
                );

                navigator.geolocation.watchPosition(
                    (pos) => {
